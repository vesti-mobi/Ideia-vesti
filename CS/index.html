/* --- seletor de período: data início / data fim, com atalhos ---
   Substituiu a grade de semanas em 26/08/2026. A grade permitia escolher semanas
   soltas de meses diferentes, o que era bonito e quase nunca usado; o que a CS
   pede o tempo todo é "o mês fechado", e isso a semana ISO não entrega. */
function seletorDePeriodo(){
  const box = el('div',{class:'wk-pick'});
  const p = estado.filtros.periodo;

  const botao = el('button',{class:'wk-btn',type:'button'},
    '<span>'+rotuloPeriodo(p)+'</span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>');
  const painel = el('div',{class:'wk-pop'});
  if(estado.pickerAberto) painel.classList.add('aberto');
  botao.onclick = (e)=>{ e.stopPropagation();
    estado.pickerAberto = !estado.pickerAberto;
    painel.classList.toggle('aberto', estado.pickerAberto);
  };

  const atalhos = el('div',{class:'wk-quick'});
  periodosProntos().forEach(([rot, jan])=>{
    const marcado = jan.ini===p.ini && jan.fim===p.fim;
    const b = el('button',{class:'wk-chip'+(marcado?' on':''),type:'button'},rot);
    b.onclick=(e)=>{e.stopPropagation(); estado.filtros.periodo = jan; renderPagina()};
    atalhos.appendChild(b);
  });
  painel.appendChild(atalhos);

  /* Os dois campos de data. `min`/`max` prendem a escolha ao que existe no
     arquivo, e mexer num deles arruma o outro se a ordem inverter — é mais
     rápido do que recusar a data e explicar por quê. */
  const linha = el('div',{class:'per-datas'});
  const campo = (rot, valor, aoMudar)=>{
    const w = el('label',{class:'per-campo'});
    w.appendChild(el('span',{},rot));
    const i = el('input',{type:'date',value:valor,min:LIMITE_DADOS.ini,max:LIMITE_DADOS.fim});
    i.onchange = ()=>{ if(i.value) aoMudar(i.value) };
    i.onclick = e=>e.stopPropagation();
    w.appendChild(i);
    return w;
  };
  linha.appendChild(campo('De', p.ini, v=>{
    estado.filtros.periodo = { ini: v, fim: v > p.fim ? v : p.fim };
    renderPagina();
  }));
  linha.appendChild(campo('Até', p.fim, v=>{
    estado.filtros.periodo = { ini: v < p.ini ? v : p.ini, fim: v };
    renderPagina();
  }));
  painel.appendChild(linha);

  /* Meses do ano em grade: um clique fecha o mês inteiro, que é o caso de uso
     que originou a mudança. Mês no futuro fica desabilitado. */
  const grade = el('div',{class:'per-meses'});
  const anoDados = LIMITE_DADOS.fim.slice(0,4);
  MESES.forEach((nome, idx)=>{
    const ini = anoDados+'-'+String(idx+1).padStart(2,'0')+'-01';
    const fim = ultimoDiaDoMes(ini);
    const futuro = ini > LIMITE_DADOS.fim;
    const jan = janela(ini, fim);
    const marcado = !futuro && jan.ini===p.ini && jan.fim===p.fim;
    const b = el('button',{class:'per-mes'+(marcado?' on':'')+(futuro?' off':''),type:'button',
      title: futuro ? 'ainda não aconteceu' : rotuloPeriodo(jan)}, nome);
    if(!futuro) b.onclick=(e)=>{e.stopPropagation(); estado.filtros.periodo = jan; renderPagina()};
    grade.appendChild(b);
  });
  painel.appendChild(el('div',{class:'per-titulo'},'Mês fechado de '+anoDados));
  painel.appendChild(grade);
  painel.onclick = e => e.stopPropagation();

  box.appendChild(botao); box.appendChild(painel);
  return box;
}

/* --- régua do período: a faixa escolhida dentro do ano ---
   Era uma régua de 52 semanas com as semanas selecionadas acesas. Agora desenha
   o ano inteiro em dias e destaca a janela, com o dia de hoje marcado. */
function renderRegua(serie){
  const box = el('div',{class:'ruler'});
  const p = periodo();
  const ano = LIMITE_DADOS.fim.slice(0,4);
  const dias = diasEntre(p.ini, p.fim) + 1;
  const grao = grãoDoPeriodo(p);
  const comoAgrupa = grao==='dia' ? 'dia a dia' : grao==='semana' ? 'por semana' : 'por mês';
  box.innerHTML = `<div class="ruler-head">
      <span class="eyebrow">Período</span>
      <span>${rotuloPeriodo(p)} · ${fmt.int(dias)} ${dias===1?'dia':'dias'} · gráficos ${comoAgrupa}</span>
    </div><div id="reguaSvg"></div>`;
  requestAnimationFrame(()=>{
    const host = box.querySelector('#reguaSvg'); if(!host) return;
    const W = host.clientWidth || 900, H = 30, pad = 2;
    const inicioAno = ano+'-01-01', fimAno = ano+'-12-31';
    const total = diasEntre(inicioAno, fimAno) + 1;
    const x = iso => pad + (diasEntre(inicioAno, iso)/total)*(W-pad*2);
    const x1 = x(p.ini), x2 = Math.max(x(p.fim)+1.5, x1+2);
    const hojeX = x(LIMITE_DADOS.fim);
    let g = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Régua do ano com o período destacado">`;
    g += `<rect x="${pad}" y="11" width="${W-pad*2}" height="4" rx="2" fill="#D7DCE3"/>`;
    g += `<rect x="${x1}" y="8" width="${x2-x1}" height="10" rx="3" fill="var(--acc)"/>`;
    g += `<rect x="${hojeX-1}" y="4" width="2" height="18" rx="1" fill="var(--ink)"/>`;
    // marcas de mês, para localizar a faixa no ano sem contar dias
    MESES.forEach((nome, i)=>{
      const mx = x(ano+'-'+String(i+1).padStart(2,'0')+'-01');
      g += `<line x1="${mx}" y1="17" x2="${mx}" y2="21" stroke="#C3CAD3" stroke-width="1"/>`;
      g += `<text x="${mx}" y="29" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--ink-3)">${nome}</text>`;
    });
    g += `</svg>`;
    host.innerHTML = g;
  });
  return box;
}

/* --- gráfico de categorias (barras horizontais coloridas) ---
   Usado pelo risco de churn: vermelho, amarelo e verde, com contagem e
   percentual. Não usa o eixo de semanas porque é um retrato do momento. */
/* Largura real de um texto, para a goteira do rótulo caber no nome em vez de
   chutar um número. Um canvas só, reaproveitado — criar um por barra seria caro
   no redraw do resize. */
const medirTexto = (()=>{
  let ctx = null;
  return (t, fonte)=>{
    if(!ctx) ctx = document.createElement('canvas').getContext('2d');
    ctx.font = fonte;
    return ctx.measureText(String(t==null?'':t)).width;
  };
})();
const escapar = t => String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function desenharCategorias(host, cats){
  if(!host) return;
  const draw = ()=>{
    host.innerHTML = '';
    const total = cats.reduce((a,c)=>a+c.v,0);
    const W = Math.max(300, host.clientWidth), linha = 46;
    /* O rótulo é escrito da direita para a esquerda a partir da goteira. Com ela
       fixa em 62px, "Thamiris Ribeiro" começava em x negativo e aparecia cortado
       na borda do SVG. Agora a goteira nasce do nome mais longo, com teto de 38%
       da largura para a barra não virar um toco — e só quem estoura o teto é
       encurtado, com o nome inteiro no title. */
    const FONTE_ROT = '12.5px "Instrument Sans", sans-serif';
    const teto = Math.round(W * 0.38);
    const encurtar = t => {
      let x = String(t==null?'':t);
      if(medirTexto(x, FONTE_ROT) <= teto) return x;
      while(x.length > 1 && medirTexto(x+'…', FONTE_ROT) > teto) x = x.slice(0,-1);
      return x + '…';
    };
    const rotulos = cats.map(c=>encurtar(c.l));
    const maiorRot = Math.ceil(Math.max(0, ...rotulos.map(t=>medirTexto(t, FONTE_ROT))));
    const P = {t:14, l: Math.min(teto + 14, Math.max(62, maiorRot + 14)), r:16};
    const H = P.t + cats.length*linha + 24;
    const max = Math.max(1, ...cats.map(c=>c.v));
    const iw = W - P.l - P.r;
    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">`;
    cats.forEach((c,i)=>{
      const y = P.t + i*linha;
      const w = Math.max(c.v>0?3:0, (c.v/max)*iw);
      const pct = total ? Math.round(c.v/total*100) : 0;
      s += `<text x="${P.l-10}" y="${y+17}" text-anchor="end" font-family="Instrument Sans, sans-serif"
             font-size="12.5" fill="var(--ink-2)">${escapar(rotulos[i])}`
        + (rotulos[i] === c.l ? '' : `<title>${escapar(c.l)}</title>`) + `</text>`;
      s += `<rect x="${P.l}" y="${y+4}" width="${iw}" height="20" rx="4" fill="var(--line-2)"/>`;
      s += `<rect x="${P.l}" y="${y+4}" width="${w}" height="20" rx="4" fill="${c.cor}"/>`;
      /* A barra da maior categoria ocupa a faixa inteira, e aí o rótulo à
         direita dela caía fora do card — era sempre o número mais importante
         que sumia. Quando não cabe do lado de fora, ele entra na barra,
         encostado na ponta e em branco. */
      const cabeFora = P.l + w + 8 + 46 <= W - P.r;
      const tx = cabeFora ? P.l + w + 8 : P.l + w - 8;
      const anc = cabeFora ? 'start' : 'end';
      s += `<text x="${tx}" y="${y+19}" text-anchor="${anc}" font-family="IBM Plex Mono, monospace" font-size="12"
             fill="${cabeFora?'var(--ink)':'#fff'}">${fmt.int(c.v)}</text>`;
      s += `<text x="${tx}" y="${y+33}" text-anchor="${anc}" font-family="IBM Plex Mono, monospace" font-size="10"
             fill="${cabeFora?'var(--ink-3)':'var(--ink-3)'}">${pct}%</text>`;
    });
    s += `<text x="${P.l}" y="${H-4}" font-family="IBM Plex Mono, monospace" font-size="10"
           fill="var(--ink-3)">${fmt.int(total)} marcas ativas na visão</text>`;
    s += `</svg>`;
    host.innerHTML = s;
  };
  draw();
  host._redraw = draw;
}

/* --- gráficos SVG --- */
/* Cabeçalho do tooltip. No agrupamento semanal o rótulo do eixo é só o dia de
   início — aqui vale dizer o intervalo inteiro, senão "10/ago" parece um dia. */
function rotuloCheio(d){
  if(!d || !d.bucket) return '';
  if(d.grao==='mes') return MESES_LONGOS[Number(d.bucket.slice(5,7))-1]+' de '+d.bucket.slice(0,4);
  if(d.grao==='dia') return fmt.date(d.bucket);
  return fmt.date(d.bucket)+' – '+fmt.date(somarDias(d.bucket,6));
}

function desenhar(host, dados, series){
  if(!host) return;
  const draw = ()=>{
    host.innerHTML='';
    const W = Math.max(320, host.clientWidth), H = 240;
    const temDir = series.some(s=>s.eixo==='dir');
    const P = {t:16, r:temDir?54:20, b:28, l:48};
    const iw = W-P.l-P.r, ih = H-P.t-P.b;
    const n = dados.length || 1;
    const esq = series.filter(s=>s.eixo!=='dir'), dir = series.filter(s=>s.eixo==='dir');
    const maxDe = (ss)=>nice(Math.max(1,...ss.flatMap(s=>dados.map(d=>d[s.k]||0))));
    const maxE = maxDe(esq), maxD = dir.length?maxDe(dir):0;
    const barras = series.filter(x=>x.tipo==='bar');
    const larguraGrupo = Math.max(3, Math.min(26, iw/n*0.62));
    const bw = larguraGrupo/Math.max(1,barras.length);
    const cx = i=>P.l + (i+0.5)*(iw/n);
    const cy = (v,max)=>P.t + ih - (v/max)*ih;

    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">`;
    // grid + eixos
    for(let g=0;g<=4;g++){
      const v = maxE*g/4, y = cy(v,maxE);
      s += `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--line-2)" stroke-width="1"/>`;
      s += `<text x="${P.l-8}" y="${y+3.5}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--ink-3)">${rotulo(v,esq[0])}</text>`;
      if(dir.length){
        const vd = maxD*g/4;
        s += `<text x="${W-P.r+8}" y="${y+3.5}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--ink-3)">${rotulo(vd,dir[0])}</text>`;
      }
    }
    // barras (lado a lado quando há mais de uma série)
    barras.forEach((sr,bi)=>{
      const max = sr.eixo==='dir'?maxD:maxE;
      const off = (bi-(barras.length-1)/2)*bw;
      dados.forEach((d,i)=>{
        const v=d[sr.k]||0, y=cy(v,max), h=Math.max(v>0?1.5:0, P.t+ih-y);
        s += `<rect x="${cx(i)-bw/2+off}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${sr.cor}" opacity=".9"/>`;
      });
    });
    // linhas
    series.filter(x=>x.tipo==='line').forEach(sr=>{
      const max = sr.eixo==='dir'?maxD:maxE;
      const pts = dados.map((d,i)=>[cx(i), cy(d[sr.k]||0, max)]);
      const path = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
      if(sr.area && pts.length){
        s += `<path d="${path} L${pts[pts.length-1][0].toFixed(1)} ${P.t+ih} L${pts[0][0].toFixed(1)} ${P.t+ih} Z" fill="${sr.cor}" opacity=".10"/>`;
      }
      s += `<path d="${path}" fill="none" stroke="${sr.cor}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>`;
      if(pts.length<=14) pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--surface)" stroke="${sr.cor}" stroke-width="1.7"/>`});
    });
    // eixo x
    const passo = Math.ceil(n/12);
    dados.forEach((d,i)=>{ if(i%passo===0||i===n-1)
      s += `<text x="${cx(i)}" y="${H-9}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--ink-3)">${d.rotulo??''}</text>`});
    s += `<line id="guia" x1="0" y1="${P.t}" x2="0" y2="${P.t+ih}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
    s += `<rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>`;
    s += `</svg>`;
    host.innerHTML = s;

    const tip = el('div',{class:'tip'}); host.appendChild(tip);
    const svg = host.querySelector('svg'), guia = svg.querySelector('#guia');
    svg.addEventListener('mousemove', ev=>{
      const rect = svg.getBoundingClientRect();
      const x = (ev.clientX-rect.left)*(W/rect.width);
      let i = Math.round((x-P.l)/(iw/n)-0.5);
      i = Math.max(0, Math.min(n-1, i)); const d = dados[i]; if(!d) return;
      guia.setAttribute('x1',cx(i)); guia.setAttribute('x2',cx(i)); guia.setAttribute('opacity','.5');
      tip.innerHTML = `<span class="t-wk">${rotuloCheio(d)}</span>`+
        series.map(sr=>`<span class="t-row">${sr.l} <b>${sr.f?sr.f(d[sr.k]||0):d[sr.k]}</b></span>`).join('');
      tip.style.left = (cx(i)*(rect.width/W))+'px';
      tip.style.top = (P.t+8)+'px';
      tip.style.opacity = 1;
    });
    svg.addEventListener('mouseleave', ()=>{tip.style.opacity=0;guia.setAttribute('opacity','0')});
  };
  draw();
  host._redraw = draw;
}
function nice(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p }
function rotulo(v, sr){
  if(!sr) return fmt.compact(v);
  return /receita|valor|gmv/i.test(sr.k) ? fmt.moneyCompact(v) : fmt.compact(v);
}

/* --- tabela --- */
function renderTabela(t, rows){
  const card = el('div',{class:'table-card'});
  const head = el('div',{class:'table-head'});
  head.innerHTML = `<h3>${t.tabela}</h3><span class="count">${rows.length} ${rows.length===1?'registro':'registros'}</span>`;
  const exp = el('button',{class:'btn',type:'button'},'Exportar CSV');
  exp.onclick = exportarCSV;
  head.appendChild(exp);
  card.appendChild(head);

  if(!rows.length){
    card.appendChild(el('div',{class:'empty'},
      `<h4>Nada por aqui com esses filtros</h4><p>Amplie o período ou limpe a busca para ver os registros.</p>`));
    const b = el('button',{class:'btn',type:'button'},'Limpar filtros');
    b.onclick=()=>{estado.filtros=filtrosPadrao();renderPagina()};
    card.querySelector('.empty').appendChild(b);
    return card;
  }

  const scroll = el('div',{class:'table-scroll'});
  const table = el('table');
  const thead = el('thead'); const trh = el('tr');
  const o = estado.ordem[t.id];
  t.colunas.forEach(c=>{
    const th = el('th', c.r?{class:'r'}:{});
    if(o && o.k===c.k) th.setAttribute('data-sorted','');
    const seta = o && o.k===c.k ? (o.dir===1?'▲':'▼') : '▲';
    th.innerHTML = `<button class="th-btn" type="button">${c.l}<span class="arw">${seta}</span></button>`;
    th.querySelector('button').onclick=()=>{
      const cur = estado.ordem[t.id];
      estado.ordem[t.id] = (cur && cur.k===c.k) ? {k:c.k, dir:cur.dir*-1} : {k:c.k, dir:c.r?-1:1};
      renderPagina();
    };
    trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);

  const tbody = el('tbody');
  rows.forEach(r=>{
    const tr = el('tr');
    t.colunas.forEach(c=>tr.appendChild(celula(r,c)));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  card.appendChild(scroll);
  return card;
}

function celula(r,c){
  const v = r[c.k];
  const td = el('td', {class:[c.r?'r':'', ['int','money','moneyC','date','semana','barPct','linksPagos'].includes(c.tipo)?'num':'', c.forte?'strong':''].filter(Boolean).join(' ')});
  switch(c.tipo){
    /* Domínio = odbc_domains.ID, o número que identifica a marca na Vesti.
       É chave de busca, então vai em tabular para alinhar na coluna. */
    case 'dominio': td.innerHTML = v==null||v==='' ? '—'
      : `<span class="dom-id">${v}</span>`; break;
    case 'cliente': td.innerHTML = `<span class="cell-main" style="font-weight:600">${v}</span>`; break;
    case 'clienteNegocio': td.innerHTML = `<span class="cell-main" style="font-weight:600">${v}</span><span class="cell-sub">${r.negocio||''}</span>`; break;
    case 'cs': td.innerHTML = v?`<span class="cs-chip"><b>${iniciais(v)}</b>${v}</span>`:'—'; break;
    case 'status': td.innerHTML = v==='ativo'
        ? '<span class="pill ok"><i></i>Ativo</span>' : '<span class="pill off"><i></i>Inativo</span>'; break;
    case 'ganho': td.innerHTML = v==='Ganho' ? '<span class="pill ok"><i></i>Ganho</span>'
        : v==='Perdido' ? '<span class="pill bad"><i></i>Perdido</span>'
        : '<span class="pill open"><i></i>Em aberto</span>'; break;
    case 'risco': {
      const cls = v==='Alto'?'bad':v==='Médio'?'warn':'ok';
      td.innerHTML = v?`<span class="pill ${cls}"><i></i>${v}</span>`
        : '<span class="pill off"><i></i>—</span><span class="cell-sub">já cancelou</span>'; break }
    case 'situacaoChurn': {
      const cls = v==='Cancelado'?'bad':v==='Inadimplente'?'warn':'open';
      td.innerHTML = `<span class="pill ${cls}"><i></i>${v}</span>`; break }
    /* O racional do risco. Cada critério que disparou é uma linha própria —
       empilhado lê melhor que uma frase corrida, e é o que a CS vai bater o
       olho antes de ligar para a marca. */
    case 'motivos': {
      const lista = Array.isArray(v) ? v : (v?[v]:[]);
      td.innerHTML = lista.length
        ? `<span class="motivos">${lista.map(m=>`<span>${m}</span>`).join('')}</span>`
        : '<span class="cell-sub">nenhum sinal de risco</span>';
      break }
    /* Dias sem pedido com a data embaixo: o número é o que ordena, a data é o
       que a CS confere. "nunca vendeu" é caso à parte — não é dia nenhum. */
    case 'diasPedido': {
      if(v==null){ td.innerHTML = '<span class="pill bad"><i></i>nunca vendeu</span>'; break }
      const cls = v>45?'bad':v>15?'warn':'ok';
      td.innerHTML = `<span class="health ${cls}"><i></i>${fmt.int(v)} d</span>`
        + (r.ultimoPedido?`<span class="cell-sub">${fmt.date(r.ultimoPedido)}</span>`:''); break }
    /* Faturas vencidas com os dias de atraso embaixo — é o atraso que decide
       se a marca é inadimplente, então ele precisa estar visível mesmo quando
       está abaixo da régua (fatura de 8 dias aparece, sem virar inadimplente). */
    case 'vencidas': {
      if(!v){ td.innerHTML = '<span class="cell-sub">—</span>'; break }
      const lim = DATA.meta.diasInadimplencia||10;
      const cls = (r.diasAtraso||0)>=lim?'bad':'warn';
      td.innerHTML = `<span class="health ${cls}"><i></i>${fmt.int(v)}</span>`
        + `<span class="cell-sub">${r.diasAtraso==null?'':'atraso de '+r.diasAtraso+' d'}</span>`; break }
    case 'tag': {
      if(v==null || v===''){ td.textContent = '—'; break }   // origem e categoria podem faltar
      const cls = c.k==='plano' ? ' t-'+String(v).replace(/\s+/g,'') : '';
      const hue = c.k==='tipo' ? ` data-hue="${hueDe(v)}"` : '';
      td.innerHTML = `<span class="tag${cls}"${hue}>${v}</span>`; break }
    case 'rel': { const x = relativo(v);
      td.innerHTML = `<span class="health ${x.cls}"><i></i>${x.txt}</span>`; break }
    case 'usoTino': {
      if(r.nuncaUsou){ td.innerHTML = '<span class="pill bad"><i></i>Nunca usou</span>'; break }
      const x = relativo(v);
      td.innerHTML = `<span class="health ${x.cls}"><i></i>${x.txt}</span><span class="cell-sub">${fmt.date(v)}</span>`;
      break }
    /* A legenda embaixo da data fala do PRAZO (venceu, vence hoje, ainda vai
       vencer). Se foi feita ou não, quem diz é a coluna Situação. */
    case 'dataRel': { const d = diasDe(v);
      const prazo = d<0 ? 'em '+Math.abs(d)+' d' : d===0 ? 'vence hoje' : 'venceu há '+d+' d';
      td.innerHTML = `<span class="cell-main">${fmt.date(v)}</span><span class="cell-sub">${prazo}</span>`; break }
    /* Tem o produto ou não: verde quando tem, vermelho quando não tem. É uma
       coluna de conferência rápida na tabela geral — sem meio-termo de propósito.
       Campo AUSENTE é caso à parte: quando a coluna é mais nova que o dados.js
       (o VestiPago entrou em 31/08/2026 e o arquivo só se refaz às 04:00), o
       valor vem undefined. Pintar tudo de "Não" faria a tela afirmar o contrário
       do que se sabe, então fica travessão até a próxima carga. */
    case 'temProduto':
      if(v == null){
        td.innerHTML = '<span class="cell-main">—</span>'
          + '<span class="cell-sub">aguardando a carga</span>';
        td.title = 'Esta coluna é mais nova que o dados.js em uso. Ela se preenche na próxima carga (04:00).';
        break;
      }
      td.innerHTML = v
        ? '<span class="pill ok"><i></i>Sim</span>'
        : '<span class="pill bad"><i></i>Não</span>'; break;
    case 'statusTino': {
      /* Marca que usa o Tino mas nunca aparece com dia de login entra por SSO da
         Vesti — dizer "nunca acessou" nesse caso seria mentira. */
      const semCad = r.semCadastro ? '<span class="cell-sub">sem marca no cadastro</span>'
        : r.foraDaCarteira ? '<span class="cell-sub">fora do painel (só compras)</span>'
        : (r.nuncaLogou && !r.nuncaUsou) ? '<span class="cell-sub">entra sem login (SSO)</span>' : '';
      td.innerHTML = (v==='Inativa'
        ? '<span class="pill bad"><i></i>Inativa</span>'
        : '<span class="pill ok"><i></i>Ativa</span>') + semCad; break }
    /* Reunião: o desfecho é o negócio fechado depois dela (creditado à última
       reunião antes do fechamento), igual ao painel das planilhas. */
    case 'resultadoReuniao': {
      if(v==='Fechou negócio'){
        td.innerHTML = '<span class="pill ok"><i></i>Fechou negócio</span>'
          + (r.negocio?`<span class="cell-sub">${r.negocio}</span>`:''); break }
      if(v==='Agendada'){ td.innerHTML = '<span class="pill open"><i></i>Agendada</span>'; break }
      td.innerHTML = '<span class="pill off"><i></i>Sem negócio</span>'; break }
    /* Assunto do ticket com a categoria embaixo: a categoria é o que agrupa
       ("Configuração de frete", "Ativação VestiPago (PIX)") e o assunto é o
       caso individual. */
    case 'ticket': td.innerHTML = `<span class="cell-main" style="font-weight:600">${v}</span>`
        // categoria pode vir com mais de um valor, separados por ";" no HubSpot
        + (r.categoria?`<span class="cell-sub">${String(r.categoria).split(';').join(' · ')}</span>`:''); break;
    case 'clienteCanal': td.innerHTML = `<span class="cell-main">${v||'—'}</span>`
        + `<span class="cell-sub">${r.canal||'Sem canal'}</span>`; break;
    case 'situacaoTicket': td.innerHTML = v==='Encerrado'
        ? '<span class="pill ok"><i></i>Encerrado</span>'
        : '<span class="pill open"><i></i>Aberto</span>'; break;
    case 'prioridade': {
      const cls = v==='Urgente'||v==='Alta' ? 'bad' : v==='Média' ? 'warn' : 'ok';
      td.innerHTML = v?`<span class="pill ${cls}"><i></i>${v}</span>`:'—'; break }
    /* Abertura com o desfecho embaixo: quantos dias levou para encerrar, ou há
       quantos dias está parado em aberto. */
    case 'dataTicket': {
      if(!v){ td.textContent = '—'; break }
      const sub = r.situacao==='Encerrado'
        ? (r.diasParaFechar==null ? 'encerrado' : 'fechou em '+r.diasParaFechar+' d')
        : 'aberto há '+Math.max(0,diasDe(v))+' d';
      td.innerHTML = `<span class="cell-main">${fmt.date(v)}</span><span class="cell-sub">${sub}</span>`;
      break }
    case 'barPct': {
      const w = Math.max(0,Math.min(100,v));
      td.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;justify-content:flex-end">
        <span style="width:54px;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;display:inline-block">
          <span style="display:block;height:100%;width:${w}%;background:var(--acc)"></span></span>
        <span style="font-family:var(--f-mono);font-size:12.5px">${fmt.pct(v)}</span></span>`; break }
    case 'linksPagos': {
      const ger = r.linksGerados||0;
      td.innerHTML = `<span class="cell-main">${fmt.int(v)}</span><span class="cell-sub">${pctTexto(v,ger)} dos gerados</span>`; break }
    case 'int': td.textContent = fmt.int(v); break;
    case 'money': td.textContent = fmt.money(v); break;
    case 'moneyC': td.textContent = fmt.moneyC(v); break;
    case 'date': td.textContent = fmt.date(v); break;
    /* Data de cadastro com o tempo de casa embaixo — é o que se quer saber
       olhando a coluna ("entrou quando?" vira "está há quanto tempo?"). */
    case 'cadastro': {
      if(!v){ td.textContent = '—'; break }
      td.innerHTML = `<span class="cell-main">${fmt.date(v)}</span><span class="cell-sub">${tempoDeCasa(v)}</span>`;
      break }
    /* Desde quando a marca tem o produto. Embaixo, há quanto tempo — é o que
       responde "esse cliente está usando pouco ou acabou de entrar?". Marca que
       entrou DENTRO do período selecionado ganha destaque: o número dela cobre
       menos dias que o dos outros e não deve ser comparado de igual para igual. */
    /* Número da regra e, embaixo, a comparação que a própria regra pede.
       `_base_` guarda o valor do comparativo (mês anterior ou mesmo mês do ano
       passado) e `_quem_` a lista de marcas, que vai no title — é assim que a
       CS confere de onde saiu o número sem precisar de outra tela. */
    case 'bonif': {
      const met = METRICAS().find(m=>m.k===c.k) || {};
      const dinheiro = met.unidade === 'R$';
      const vv = v || 0;
      const base = r['_base_'+c.k];
      const quem = r['_quem_'+c.k] || [];
      /* As três colunas de dinheiro (VestiPago, GMV e mensalidade) mostram a
         variação em PORCENTAGEM, não em reais (pedido da Laura, 27/08/2026):
         nelas o que interessa é o quanto a carteira cresceu ou caiu, e o valor
         em R$ já está no número de cima. O delta em reais continua no title. */
      const emPct = c.k==='vestipago' || c.k==='gmv' || c.k==='mensalidade';
      let sub = '', deltaTxt = '';
      if(base != null){
        const d = vv - base;
        const cls = d > 0 ? 'var-up' : d < 0 ? 'var-down' : 'var-flat';
        const sinal = d > 0 ? '+' : d < 0 ? '−' : '';
        const absR = dinheiro ? fmt.moneyCompact(Math.abs(d)) : fmt.int(Math.abs(d));
        const contra = met.comparacao === 'anoAnterior' ? 'vs. mesmo mês de '+(Number(mesBonificacao().slice(0,4))-1)
                    : MARCA_DAGUA.has(c.k)               ? 'vs. marca d\u2019água'
                                                        : 'vs. mês anterior';
        let txt;
        if(!emPct) txt = d===0 ? 'igual' : sinal+absR;
        /* Sem base não existe porcentagem: dividir por zero daria ∞, e dizer
           "+100%" quando o ano passado foi zero seria inventar crescimento. */
        else if(!base) txt = vv ? 'sem base' : 'igual';
        else txt = d===0 ? 'igual' : sinal+fmt.pct1(Math.abs(d)/base*100);
        deltaTxt = (dinheiro?fmt.moneyCompact(d):fmt.int(d)) + ' ' + contra
          + ' (base ' + (dinheiro?fmt.moneyCompact(base):fmt.int(base)) + ')';
        sub = `<span class="cell-sub ${cls}">${txt} <em>${contra}</em></span>`;
      }
      /* Varejos: a classificação Atacado/Varejo tem uma data de corte, e filial
         criada depois dela ainda não tem tipo. Mostrar só "0" faria parecer que
         não abriu nenhuma loja no mês. */
      if(c.k==='filiais'){
        const semTipo = r.filiaisSemTipo || 0;
        if(semTipo) sub = `<span class="cell-sub">+${fmt.int(semTipo)} sem classificação</span>`;
      }
      td.innerHTML = `<span class="cell-main">${dinheiro?fmt.moneyCompact(vv):fmt.int(vv)}</span>` + sub;
      const quemSem = c.k==='filiais' ? (r['_quem_filiaisSemTipo']||[]) : [];
      let titulo = (emPct && deltaTxt ? deltaTxt + (quem.length?' · ':'') : '')
        + quem.slice(0,40).join(', ')
        + (quemSem.length ? (quem.length?' · ':'') + 'sem classificação: ' + quemSem.slice(0,20).join(', ') : '');
      /* Varejos é a única coluna editável do painel: o cadastro não sabe dizer
         se a filial é de varejo (a classificação está parada em 30/03/2026),
         então quem sabe é a CS. Clicar abre a lista daquele mês. */
      if(c.k==='filiais' && filiaisDoMes(mesBonificacao())){
        td.classList.add('td-edit');
        if(filiaisDoMes(mesBonificacao()).some(f=>f.cs===r.cs && varejoPendente(f))){
          td.innerHTML += '<span class="ed-pend" style="display:inline-block;margin-left:6px;vertical-align:middle"></span>';
        }
        td.onclick = ()=>abrirEditorVarejo(r.cs);
        titulo = (titulo ? titulo + ' · ' : '') + 'clique para marcar quais são de varejo';
      }
      if(titulo) td.title = titulo;
      break }
    case 'implantado': {
      if(!v){ td.textContent = '—'; break }
      const novo = dentroDaJanela(v);
      const origem = r.implantadoOrigem ? ' · '+r.implantadoOrigem : '';
      td.innerHTML = `<span class="cell-main">${fmt.date(v)}</span>`
        + `<span class="cell-sub${novo?' novo':''}">${novo?'entrou neste período':tempoDeCasa(v)+origem}</span>`;
      break }
    default: td.textContent = v==null?'—':v;
  }
  return td;
}

/* ============================================================================
   6.5 MARCAÇÃO MANUAL DE VAREJO
   ----------------------------------------------------------------------------
   A regra "varejos novos" só conta filial classificada como VAREJO, e essa
   classificação vem do Relatório Confecções, CONGELADO em 30/03/2026 — na
   prática, toda filial nova nasce "sem classificação" e fica fora da conta. A
   Laura pediu (26/08/2026) para poder dizer na mão quais são de varejo e para
   que isso ficasse salvo.

   Fica salvo em DOIS lugares, de propósito:
   - no navegador (localStorage), no instante do clique. Sobrevive à carga
     diária, que reescreve o dados.js inteiro toda madrugada — sem isso a
     marcação sumiria às 04:00;
   - em CS/varejo_manual.json, que o fetcher lê na carga seguinte. É o que faz a
     marcação virar o número oficial, igual para todo mundo que abre o painel.
     Como uma página estática não commita nada sozinha, quem gera o arquivo é o
     botão "Baixar varejo_manual.json" do editor.
   Enquanto a marcação está só no navegador, ela aparece com um ponto dourado.

   Precedência do tipo de uma filial:
     marcação neste navegador  >  varejo_manual.json publicado  >  cadastro. */
const VAREJO_LS = 'painelcs:varejo-manual';
let _varejoCache = null;
function varejoLocal(){
  if(_varejoCache) return _varejoCache;
  let j = null;
  try{ j = JSON.parse(localStorage.getItem(VAREJO_LS)) }catch(e){ j = null }
  _varejoCache = { filiais:(j&&j.filiais)||{}, extras:(j&&j.extras)||[] };
  return _varejoCache;
}
function varejoLocalSalvar(v){
  _varejoCache = v;
  try{ localStorage.setItem(VAREJO_LS, JSON.stringify(v)) }
  catch(e){ alert('Não consegui guardar a marcação neste navegador: '+e.message) }
}
function varejoPublicado(){
  const m = (DATA.bonificacao||{}).marcacaoManual || {};
  return { filiais: m.filiais||{}, extras: m.extras||[] };
}
const chaveExtra = x => 'extra:'+x.dom+':'+x.mes;
const hojeISO = ()=>new Date().toISOString().slice(0,10);

/* Filiais novas do mês + as marcas apontadas à mão que ainda não foram
   publicadas. Devolve null quando o dados.js é antigo e não traz a lista. */
function filiaisDoMes(mes){
  const b = DATA.bonificacao || {};
  if(!b.filiais) return null;
  const jaPublicado = new Set(varejoPublicado().extras.map(chaveExtra));
  const locais = varejoLocal().extras
    .filter(x=>x.mes===mes && !jaPublicado.has(chaveExtra(x)))
    .map(x=>({ mes:x.mes, cs:x.cs||'Sem CS', dom:String(x.dom), id:chaveExtra(x),
               nome:x.nome||x.dom, tipo:'Varejo', auto:null, manual:true, extra:true, soLocal:true }));
  return b.filiais.filter(f=>f.mes===mes).concat(locais);
}
/* f.tipo já vem do fetcher com o varejo_manual.json aplicado; o que falta somar
   é a marcação deste navegador, que ainda não passou por nenhuma carga. */
function varejoTipo(f){
  const loc = varejoLocal().filiais[f.id];
  if(!loc) return f.tipo || null;
  return loc.tipo==='auto' ? (f.auto||null) : loc.tipo;
}
function varejoPendente(f){ return !!f.soLocal || !!varejoLocal().filiais[f.id] }
/* Existe uma decisão humana valendo (deste navegador ou já publicada)? */
function varejoNaMao(f){ return !!varejoLocal().filiais[f.id] || !!f.manual }

/* valor: 'Varejo' | 'Atacado' | 'auto' (voltar a seguir o cadastro) */
function varejoMarcar(f, valor){
  const v = varejoLocal();
  if(f.soLocal && valor!=='Varejo'){
    // marca apontada à mão que ainda não foi publicada: some da lista
    v.extras = v.extras.filter(x=>chaveExtra(x)!==f.id);
  }else if(valor==='auto' && !f.extra && !varejoPublicado().filiais[f.id]){
    delete v.filiais[f.id];
  }else{
    /* Desfazer uma marcação JÁ PUBLICADA também é uma marcação: precisa ficar
       guardada como 'auto', senão o valor do arquivo voltaria a valer. */
    v.filiais[f.id] = { tipo:valor, nome:f.nome };
  }
  varejoLocalSalvar(v);
}
function varejoAdicionarMarca(cs, mes, nome, dom){
  const v = varejoLocal();
  const x = { mes, dom:String(dom), nome, cs, em:hojeISO() };
  if(v.extras.some(y=>chaveExtra(y)===chaveExtra(x))) return false;
  v.extras.push(x); varejoLocalSalvar(v); return true;
}

/* O arquivo final: o que já está publicado, com as marcações deste navegador
   por cima. É este JSON que vai para CS/varejo_manual.json. */
function varejoJson(){
  const pub = varejoPublicado(), loc = varejoLocal();
  const filiais = {};
  Object.keys(pub.filiais).forEach(id=>filiais[id]=Object.assign({},pub.filiais[id]));
  const desfeitos = new Set();
  Object.keys(loc.filiais).forEach(id=>{
    const m = loc.filiais[id];
    if(m.tipo==='auto'){ delete filiais[id]; desfeitos.add(id); return }
    filiais[id] = { tipo:m.tipo, nome:m.nome||null, em:hojeISO() };
  });
  const extras = pub.extras.filter(x=>!desfeitos.has(chaveExtra(x))).map(x=>Object.assign({},x));
  const vistos = new Set(extras.map(chaveExtra));
  loc.extras.forEach(x=>{ if(!vistos.has(chaveExtra(x))){ vistos.add(chaveExtra(x)); extras.push(x) } });
  return {
    _leia: 'Marcacao manual Atacado x Varejo das filiais novas, usada pela aba de Bonificacao do Painel de '
         + 'Clientes. Vale mais que a classificacao do Relatorio Confeccoes. Gerado pelo proprio painel: aba '
         + 'Bonificacao > coluna "Varejos novos" > "Baixar varejo_manual.json". Salve por cima de '
         + 'CS/varejo_manual.json e publique (node publicar.js --varejo --sem-dados) para valer para todo mundo na '
         + 'proxima carga.',
    filiais, extras,
  };
}

/* --- A marcação compartilhada: ler de todo mundo, salvar para todo mundo -----
   O painel é estático no GitHub Pages: não consegue commitar nada sozinho, e um
   token do GitHub dentro desta página seria público. Quem grava é a mesma API
   que já cuida das edições compartilhadas do relatoriocs2 (stark-admin, na
   Vercel): ela guarda o GH_TOKEN e commita CS/varejo_manual.json.

   Dois caminhos, e os dois importam:
   - no BOOT o painel lê /api/varejo e aplica por cima do dados.js. É isso que faz
     a marcação de uma CS aparecer para as outras no mesmo dia, sem esperar a
     carga das 04:00 (que também lê o arquivo, para os números agregados);
   - o botão "Salvar para todo mundo" manda só o que mudou neste navegador e o
     servidor aplica em cima do arquivo mais novo, com retry — duas pessoas
     marcando ao mesmo tempo não se apagam.

   A senha é a mesma do painel (env CS_SENHA na Vercel). Se um dia a senha da
   tela mudar, a variável na Vercel tem de mudar junto. */
const API_VAREJO = 'https://vesti-contas.vercel.app/api/varejo';
const SENHA_PAINEL = 'Mudar123';

/* Aplica no dados.js da memória o que veio do servidor: o tipo de cada filial e
   as marcas apontadas à mão. Devolve false quando o dados.js é antigo. */
function aplicarMarcacaoPublicada(doc){
  const b = DATA.bonificacao;
  if(!b || !b.filiais) return false;
  b.marcacaoManual = { filiais: doc.filiais||{}, extras: doc.extras||[] };
  b.filiais = b.filiais.filter(f=>!f.extra);
  b.filiais.forEach(f=>{
    const m = b.marcacaoManual.filiais[f.id];
    f.tipo = m ? m.tipo : (f.auto||null);
    f.manual = !!m;
  });
  b.marcacaoManual.extras.forEach(x=>{
    b.filiais.push({ mes:String(x.mes), cs:x.cs||'Sem CS', dom:String(x.dom),
      id:chaveExtra(x), nome:x.nome||x.dom, criado:x.em||null,
      tipo:'Varejo', auto:null, manual:true, extra:true });
  });
  limparLocalJaPublicado();
  return true;
}

/* O que este navegador marcou e o servidor já confirmou deixa de ser pendência —
   senão o ponto dourado ficaria aceso para sempre depois de salvar. */
function limparLocalJaPublicado(){
  const pub = varejoPublicado(), loc = varejoLocal();
  const chavesPub = new Set(pub.extras.map(chaveExtra));
  let mudou = false;
  Object.keys(loc.filiais).forEach(id=>{
    const meu = loc.filiais[id], dele = pub.filiais[id];
    const aindaLa = !!dele || chavesPub.has(id);
    const igual = meu.tipo==='auto' ? !aindaLa : (dele && dele.tipo===meu.tipo);
    if(igual){ delete loc.filiais[id]; mudou = true }
  });
  const antes = loc.extras.length;
  loc.extras = loc.extras.filter(x=>!chavesPub.has(chaveExtra(x)));
  if(loc.extras.length !== antes) mudou = true;
  if(mudou) varejoLocalSalvar(loc);
}

/* Boot: busca a marcação de todo mundo. Se a API estiver fora, o painel segue
   com o que veio da carga — a marcação local continua valendo na tela. */
function carregarMarcacaoVarejo(){
  if(!(DATA.bonificacao||{}).filiais) return;
  fetch(API_VAREJO, {cache:'no-store'})
    .then(r=>r.ok ? r.json() : Promise.reject(new Error('HTTP '+r.status)))
    .then(j=>{ if(j && j.ok && aplicarMarcacaoPublicada(j)) renderPagina() })
    .catch(e=>console.warn('marcação de varejo: não consegui ler do servidor —', e.message));
}

/* Manda só o DELTA deste navegador. O servidor aplica em cima do arquivo mais
   novo e devolve o resultado inteiro, que a gente adota na hora. */
function salvarMarcacaoVarejo(){
  const loc = varejoLocal();
  if(!Object.keys(loc.filiais).length && !loc.extras.length){
    return Promise.resolve({ok:true, semMudanca:true});
  }
  return fetch(API_VAREJO, {
    method:'POST',
    headers:{'Content-Type':'application/json', Authorization:'Bearer '+SENHA_PAINEL},
    body: JSON.stringify({ filiais: loc.filiais, extras: loc.extras }),
  }).then(r=>r.json().catch(()=>({ok:false,erro:'o servidor respondeu algo que não é JSON'}))
      .then(j=>{ if(!r.ok || !j.ok) throw new Error(j.erro || ('erro '+r.status)); return j }))
    .then(j=>{
      varejoLocalSalvar({filiais:{}, extras:[]});
      aplicarMarcacaoPublicada(j);
      renderPagina();
      return j;
    });
}

/* --- o editor: uma linha por filial, três botões por linha --- */
function abrirEditorVarejo(cs){
  const mes = mesBonificacao();
  // nunca dois editores abertos ao mesmo tempo: o de baixo ficaria mostrando o estado velho
  document.querySelectorAll('.ed-back').forEach(x=>x.remove());
  const back = el('div',{class:'ed-back'});
  const box = el('div',{class:'ed-box'});
  back.appendChild(box);
  const aoTeclar = e => { if(e.key==='Escape') fechar() };
  const fechar = ()=>{ back.remove(); document.removeEventListener('keydown', aoTeclar) };
  document.addEventListener('keydown', aoTeclar);
  back.onclick = e => { if(e.target===back) fechar() };

  const cob = (DATA.bonificacao||{}).coberturaTipo || null;
  const head = el('div',{class:'ed-head'});
  const corpo = el('div',{class:'ed-corpo'});
  const foot = el('div',{class:'ed-foot'});
  box.appendChild(head); box.appendChild(corpo); box.appendChild(foot);

  /* A lista de marcas do "varejo em domínio próprio" é só a da carteira do CS —
     é onde esse caso vai estar. */
  const dlId = 'lista-marcas-varejo';
  const antigo = $('#'+dlId); if(antigo) antigo.remove();
  const dl = el('datalist',{id:dlId});
  (DATA.clientes||[]).filter(c=>c.cs===cs).forEach(c=>dl.appendChild(el('option',{value:c.nome})));
  document.body.appendChild(dl);

  const pintar = ()=>{
    const lista = (filiaisDoMes(mes)||[]).filter(f=>f.cs===cs)
      .sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
    const varejos = lista.filter(f=>varejoTipo(f)==='Varejo').length;
    const pendentes = lista.filter(varejoPendente).length;

    head.innerHTML = '<h3>Varejos novos — '+cs+' · '+rotuloMes(mes)+'</h3>'
      + '<p>Filiais novas desta carteira no mês. Marque quais são de <b>varejo</b>: essa marcação entra na '
      + 'conta da bonificação por cima da classificação do cadastro'
      + (cob && cob.ate ? ', que só cobre até <b>'+fmt.date(cob.ate)+'</b>' : '')
      + '. Clique em <b>salvar</b> e ela passa a valer para todo mundo — o painel de quem abrir depois já vem marcado.</p>';

    corpo.innerHTML = '';
    if(!lista.length){
      corpo.appendChild(el('div',{class:'ed-vazio'},
        'Nenhuma filial nova desta carteira em '+rotuloMes(mes)+'.'));
    }
    lista.forEach(f=>{
      const t = varejoTipo(f), naMao = varejoNaMao(f);
      const linha = el('div',{class:'ed-linha'});
      const ponto = varejoPendente(f)
        ? '<span class="ed-pend" style="display:inline-block;margin-right:6px;vertical-align:middle"></span>' : '';
      const origem = f.extra ? 'marca apontada à mão · não é filial no cadastro'
        : 'criada em '+fmt.date(f.criado)+' · cadastro diz: '+(f.auto || 'sem classificação');
      const nota = varejoPendente(f) ? ' · marcado aqui, ainda não publicado'
                 : (f.manual ? ' · marcado à mão e publicado' : '');
      linha.appendChild(el('div',{class:'ed-nome'},
        ponto + (f.nome||'—') + '<small>' + origem + nota + '</small>'));
      const ops = el('div',{class:'ed-op'});
      [['Varejo','Varejo'],['Atacado','Atacado'],[f.extra?'Remover':'Automático','auto']].forEach(([rot,val])=>{
        /* Aceso = a decisão que está valendo. Sem decisão humana, quem está
           valendo é o cadastro — e o botão aceso é o "Automático". */
        const aceso = val==='auto' ? !naMao : (naMao && t===val);
        const b = el('button',{type:'button',class:aceso?'on':''},rot);
        b.onclick = ()=>{ varejoMarcar(f,val); pintar(); renderPagina() };
        ops.appendChild(b);
      });
      linha.appendChild(ops);
      corpo.appendChild(linha);
    });

    /* Varejo em domínio separado ("Nicoboco Varejo"): não existe filial no
       cadastro para marcar, então a marca inteira é apontada como varejo novo
       do mês. São poucos casos, mas são justamente os que a régua não pega. */
    corpo.appendChild(el('div',{class:'ed-sec'},'Varejo em domínio próprio'));
    corpo.appendChild(el('div',{class:'ed-vazio',style:'padding:6px 0 0'},
      'Marca desta carteira que abriu varejo sem virar filial no cadastro. Entra como varejo novo de '
      + rotuloMes(mes)+'.'));
    const add = el('div',{class:'ed-add'});
    const inp = el('input',{type:'text',list:dlId,placeholder:'nome da marca'});
    const bt = el('button',{class:'btn',type:'button'},'Adicionar');
    const adicionar = ()=>{
      const nome = inp.value.trim(); if(!nome) return;
      const c = (DATA.clientes||[]).find(x=>x.nome===nome)
             || (DATA.clientes||[]).find(x=>String(x.nome||'').toLowerCase()===nome.toLowerCase());
      if(!c){ alert('Não achei "'+nome+'" na lista de marcas.'); return }
      if(!varejoAdicionarMarca(c.cs||cs, mes, c.nome, c.dominio)){ alert('Essa marca já está na lista.'); return }
      inp.value=''; pintar(); renderPagina();
    };
    bt.onclick = adicionar;
    inp.onkeydown = e => { if(e.key==='Enter') adicionar() };
    add.appendChild(inp); add.appendChild(bt);
    corpo.appendChild(add);

    foot.innerHTML = '';
    foot.appendChild(el('div',{class:'ed-nota'},
      '<b>'+varejos+'</b> '+(varejos===1?'varejo novo':'varejos novos')+' em '+rotuloMes(mes)+' para '+cs+'. '
      + (pendentes ? '<b>'+pendentes+'</b> '+(pendentes===1?'marcação ainda não salva':'marcações ainda não salvas')
          + ' para o time — clique em salvar.'
        : 'Tudo salvo para todo mundo.')));
    const erro = el('div',{class:'ed-erro',style:'display:none'});

    /* O botão que a Laura pediu: salva e vale para todo mundo, sem baixar
       arquivo nem publicar nada à mão. */
    const salvar = el('button',{class:'btn ed-salvar',type:'button'},'Salvar para todo mundo');
    if(!pendentes) salvar.setAttribute('disabled','');
    salvar.onclick = ()=>{
      salvar.setAttribute('disabled',''); salvar.textContent='Salvando…';
      erro.style.display='none';
      salvarMarcacaoVarejo()
        .then(()=>{ pintar();
          const b = foot.querySelector('.ed-salvar');
          if(b){ b.textContent='Salvo ✓'; setTimeout(()=>{ if(foot.contains(b)) pintar() },1800) } })
        .catch(e=>{
          salvar.removeAttribute('disabled'); salvar.textContent='Salvar para todo mundo';
          erro.textContent = 'Não deu para salvar: ' + e.message
            + ' A marcação continua guardada neste navegador — dá para tentar de novo ou baixar o arquivo.';
          erro.style.display='';
        });
    };
    /* Plano B para quando a API estiver fora: o arquivo continua podendo ser
       publicado à mão (node publicar.js --varejo --sem-dados). */
    const baixar = el('button',{class:'btn btn-ghost',type:'button'},'Baixar arquivo');
    baixar.title = 'Plano B: gera o varejo_manual.json para publicar à mão';
    baixar.onclick = ()=>{
      const blob = new Blob([JSON.stringify(varejoJson(),null,2)+'\n'],{type:'application/json'});
      const a = el('a'); a.href = URL.createObjectURL(blob); a.download='varejo_manual.json'; a.click();
      URL.revokeObjectURL(a.href);
    };
    const sair = el('button',{class:'btn',type:'button'},'Fechar');
    sair.onclick = fechar;
    foot.appendChild(salvar); foot.appendChild(baixar); foot.appendChild(sair);
    foot.appendChild(erro);
  };
  pintar();
  document.body.appendChild(back);
}

function exportarCSV(){
  const {rows, colunas} = ultimoRender;
  const linhas = [colunas.map(c=>c.l).join(';')];
  rows.forEach(r=>linhas.push(colunas.map(c=>{
    let v = r[c.k];
    if(c.tipo==='clienteNegocio') v = `${r.cliente} — ${r.negocio||''}`;
    /* O racional é uma lista; sem isso o CSV sairia com os critérios colados
       por vírgula e ninguém entenderia onde um termina e o outro começa. */
    if(Array.isArray(v)) v = v.join(' · ');
    if(c.tipo==='diasPedido') v = v==null ? 'nunca vendeu' : v;
    return String(v==null?'':v).replace(/;/g,',');
  }).join(';')));
  const blob = new Blob(['\ufeff'+linhas.join('\n')],{type:'text/csv;charset=utf-8'});
  const a = el('a'); a.href = URL.createObjectURL(blob);
  a.download = `${estado.aba}-${periodo().ini}_a_${periodo().fim}.csv`; a.click();
  URL.revokeObjectURL(a.href);
}

function debounce(fn,ms){let id;return(...a)=>{clearTimeout(id);id=setTimeout(()=>fn(...a),ms)}}

/* O topo passou a espelhar o período escolhido, não a semana corrente: com o
   filtro em datas, "Semana 33" no cabeçalho e "01/08 a 31/08" no filtro seriam
   duas respostas diferentes para a mesma pergunta. `atualizarTopo` é chamada a
   cada render. */
function atualizarTopo(){
  const t = aba();
  /* Aba sem filtro de período (Bonificação) trabalha em mês fechado — mostrar a
     janela de datas no topo seria uma resposta que não vale para o que está na
     tela. */
  if(t && t.filtros && !t.filtros.includes('periodo') && t.filtros.includes('mesBonificacao')){
    $('#wkNow').textContent = rotuloMes(mesBonificacao());
    $('#wkRange').textContent = 'mês fechado';
    return;
  }
  const p = periodo();
  const dias = diasEntre(p.ini, p.fim) + 1;
  $('#wkNow').textContent = rotuloPeriodo(p);
  $('#wkRange').textContent = fmt.int(dias) + (dias===1?' dia':' dias') + ' na visão';
}
atualizarTopo();

/* selo de origem dos dados + ressalvas de fonte, visíveis no painel */
(function selo(){
  const chip = $('.chip-demo');
  if(!DADOS_REAIS){ chip.innerHTML = '<i></i> Dados de exemplo'; return }
  const g = DATA.meta.geradoEm ? new Date(DATA.meta.geradoEm) : null;
  const quando = g ? g.toLocaleDateString('pt-BR') + ' ' + g.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
  chip.innerHTML = '<i style="background:var(--pos)"></i> BigQuery + HubSpot + Tino · ' + quando;
  chip.title = 'Dados reais. Clique para ver as ressalvas de fonte.';
  chip.style.cursor = 'pointer';
  const av = (DATA.meta.avisos)||{};
  chip.onclick = ()=>{
    const box = $('#avisos');
    box.style.display = box.style.display==='block' ? 'none' : 'block';
  };
  const foot = document.querySelector('.rail-foot');
  foot.insertAdjacentHTML('beforeend',
    '<div id="avisos" style="display:none;margin-top:10px;font-size:11px;line-height:1.45;color:var(--ink-3)">'
    + Object.values(av).map(t=>'<p style="margin:0 0 7px">'+t+'</p>').join('') + '</div>');
})();

/* Só desenha depois do login: com o app escondido os gráficos mediriam
   largura 0 e sairiam espremidos. */
let __jaDesenhou = false;
window.__cs_boot = function(){
  if(__jaDesenhou) return;
  __jaDesenhou = true;
  renderNav();
  renderPagina();
  /* Depois de desenhar, e não antes: a marcação de varejo vem de outra origem e
     não pode segurar o painel se a API estiver lenta ou fora. */
  carregarMarcacaoVarejo();
};
if(document.getElementById('app').style.display !== 'none') window.__cs_boot();

/* clicar fora fecha os seletores de semanas, de canais e de CS */
document.addEventListener('click', ()=>{
  if(!estado.pickerAberto && !estado.canalAberto && !estado.csAberto) return;
  estado.pickerAberto = false;
  estado.canalAberto = false;
  estado.csAberto = false;
  document.querySelectorAll('.wk-pop.aberto').forEach(p=>p.classList.remove('aberto'));
});

window.addEventListener('resize', debounce(()=>renderPagina(), 180));
