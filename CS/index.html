*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:3px}

/* eyebrow / rótulo utilitário */
.eyebrow{
  font-family:var(--f-mono);
  font-size:10.5px;
  font-weight:500;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--ink-3);
}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh}

/* --- sidebar --- */
.rail{
  background:var(--paper);
  border-right:1px solid var(--line);
  padding:22px 14px 24px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:26px;
  overflow:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:var(--dark);
  background-image:var(--logo-icone);
  background-size:20px auto;background-position:center 54%;background-repeat:no-repeat;
}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--ink-3);line-height:1.1;margin-top:2px}

.nav-group+.nav-group{margin-top:22px}
.nav-group .eyebrow{padding:0 8px;margin-bottom:8px;display:block}
.nav-btn{
  display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:0;cursor:pointer;
  padding:7px 8px;border-radius:var(--r-md);
  font-size:13.5px;color:var(--ink-2);text-align:left;
  position:relative;transition:background .13s ease,color .13s ease;
}
.nav-btn:hover{background:var(--sunken);color:var(--ink)}
.nav-btn .dot{width:5px;height:5px;border-radius:50%;background:var(--line);flex:none;opacity:.45;transition:opacity .13s}
.nav-btn:hover .dot,.nav-btn[aria-current="true"] .dot{opacity:1}
.nav-btn[aria-current="true"]{background:var(--nav-soft,var(--sunken));color:var(--nav-c,var(--ink));font-weight:600}
.nav-btn[aria-current="true"]::before{content:"";position:absolute;left:-14px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--nav-c,var(--brand))}
.rail-foot{margin-top:auto;padding:0 8px;border-top:1px solid var(--line);padding-top:14px}
.rail-foot p{margin:0;font-size:11.5px;color:var(--ink-3);line-height:1.4}

/* --- main --- */
.main{min-width:0;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;gap:16px;
  padding:14px 30px;border-bottom:1px solid var(--line);
  background:var(--canvas);position:sticky;top:0;z-index:20;
}
.week-now{display:flex;align-items:baseline;gap:9px}
.week-now b{font-family:var(--f-display);font-size:14px;font-weight:600}
.week-now span{font-size:12.5px;color:var(--ink-3)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip-demo{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:100px;padding:5px 11px 5px 9px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
}
.chip-demo i{width:6px;height:6px;border-radius:50%;background:var(--gold);display:block}
.avatar{
  width:29px;height:29px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:11.5px;font-weight:600;border:1px solid #D3E2DD;
}

.page{padding:26px 30px 64px;max-width:1500px;width:100%}

.page-head{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:20px}
.page-head .eyebrow{color:var(--acc)}
.page-head h1{
  font-family:var(--f-display);font-weight:600;
  font-size:27px;letter-spacing:-.025em;margin:6px 0 4px;line-height:1.1;
}
.page-head p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:62ch}

/* --- filtros --- */
.filters{
  display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
  padding:14px 16px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:18px;
}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select{
  border:1px solid var(--line);background:var(--sunken);
  border-radius:var(--r-sm);padding:7px 10px;font-size:13px;
  min-width:190px;transition:border-color .13s, background .13s;
}
.field select{min-width:150px;appearance:none;padding-right:28px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23818B86' stroke-width='1.4'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
.field input:hover,.field select:hover{border-color:#CDD3DC}
.field input:focus,.field select:focus{background:var(--surface);border-color:var(--brand-2);outline:none}
.filters-actions{margin-left:auto;display:flex;align-items:center;gap:10px}

/* seletor de período (e o de CS/canal, que herda os mesmos botões) */
.wk-pick{position:relative}
.wk-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:210px;
  border:1px solid var(--line);background:var(--sunken);border-radius:var(--r-sm);
  padding:7px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.wk-btn:hover{border-color:#CDD3DC}
.wk-btn svg{color:var(--ink-3);flex:none}
.wk-pop{display:none;position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:330px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 12px 34px -14px rgba(17,20,24,.42);padding:12px}
.wk-pop.aberto{display:block}
.wk-quick{display:flex;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.wk-chip{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);
  padding:5px 4px;font-size:11.5px;cursor:pointer;color:var(--ink-2)}

/* --- seletor de período: dois campos de data + grade de meses --- */
.per-datas{display:flex;gap:8px;margin-bottom:12px}
.per-campo{flex:1;display:flex;flex-direction:column;gap:4px}
.per-campo span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;

/* chip de canal: mesmo botão das semanas, mas com texto em vez de número */

thead th{

}

thead th.r .th-btn{justify-content:flex-end}
/* Tabela sem botão de ordenar (a de pontos): o texto do cabeçalho alinha sozinho. */

.th-btn .arw{opacity:0;font-size:9px}

.cell-sub.var-down{color:var(--neg);font-weight:600}

.cell-sub em{font-style:normal;font-weight:400;color:var(--ink-3);opacity:.85}

/* Racional do risco de churn: um critério por linha, com um tracinho na frente.

.motivos{display:flex;flex-direction:column;gap:2px;min-width:20ch;max-width:34ch}

.health{display:inline-flex;align-items:center;gap:7px}

/* --- login --- */
/* Fundo escuro porque a palavra "vesti" do logo é branca. */
#loginScreen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--dark);padding:20px}
.login-box{width:330px;max-width:100%;text-align:center;padding:38px 32px 32px;
  background:var(--dark-2);border:1px solid #262D36;border-radius:14px;
  box-shadow:0 24px 60px -30px rgba(0,0,0,.9)}
.login-mark{width:132px;height:90px;margin:0 auto 20px;
  background-image:var(--logo-full);background-size:contain;
  background-position:center;background-repeat:no-repeat}
.login-box h1{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0 0 3px;
  letter-spacing:-.02em;color:#F2F4F7}
.login-box p{margin:0 0 24px;font-size:12.5px;color:#8A93A0}

  border-radius:var(--r-sm);padding:10px 11px;font-size:14px;text-align:center}

.login-box button{width:100%;margin-top:12px;border:0;background:var(--brand-2);color:#fff;
  border-radius:var(--r-sm);padding:11px;font-size:13.5px;font-weight:600;cursor:pointer}
.login-box button:hover{background:#15AAA0}

<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-mark" role="img" aria-label="Vesti"></div>
    <h1>Painel de Clientes</h1>
    <p>Customer Success</p>
    <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <div id="loginError">Senha incorreta</div>
    <button onclick="doLogin()">Entrar</button>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <!-- ===================== NAV ===================== -->
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark" role="img" aria-label="Vesti"></div>
      <div>
        <div class="brand-name">Painel de Clientes</div>
        <div class="brand-sub">Customer Success</div>
      </div>
    </div>
    <nav id="nav" aria-label="Seções do painel"></nav>
    <div class="rail-foot">
      <p>Os gráficos agrupam por dia, semana ou mês conforme o tamanho do período.</p>
    </div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <div class="main">
    <header class="topbar">
      <div class="week-now">
        <b id="wkNow">Período</b>
        <span id="wkRange">carregando…</span>
      </div>
      <div class="topbar-right">
        <span class="chip-demo"><i></i> Dados de exemplo</span>
        <div class="avatar" title="Conta">CS</div>
      </div>
    </header>

    <main class="page" id="page"></main>
  </div>
</div>

<script>
/* Login. ATENÇÃO: isto é uma tranca de porta, não um cofre — a checagem roda no
   navegador e o dados.js fica acessível por URL direta. Só serve para evitar
   que alguém abra o painel por acaso; não protege o conteúdo. */
/* sessionStorage pode lançar (modo restrito, origem opaca). Se falhar, o login
   ainda funciona — só não fica lembrado ao recarregar. */
function _ss(acao, val){
  try{ return acao==='get' ? sessionStorage.getItem('cs_auth') : sessionStorage.setItem('cs_auth', val) }
  catch(e){ return null }
}
function doLogin(){
  if(document.getElementById('loginPass').value === 'Mudar123'){
    _ss('set','1');
    entrar();
  } else {
    document.getElementById('loginError').style.display='block';
    document.getElementById('loginPass').style.borderColor='#C0453B';
  }
}
function entrar(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='grid';
  if(window.__cs_boot) window.__cs_boot();
}
if(_ss('get')==='1'){
  document.addEventListener('DOMContentLoaded', entrar);
}
</script>

<!-- Dados reais, gerados por `node fetch_dados.js` (BigQuery + HubSpot).
     Se o arquivo não existir, o painel cai no mock e avisa no topo. -->
<script src="dados.js"></script>
<script>
/* ============================================================================
   1. DADOS
   ----------------------------------------------------------------------------
   Tudo abaixo é MOCK, gerado por um PRNG com semente fixa só para dar forma ao
   layout. Para popular com dados reais basta substituir o objeto DATA por um
   JSON com o mesmo formato — nenhuma outra parte do arquivo precisa mudar.

   DATA = {
     meta: { ano, semanaAtual,
             inicio:'AAAA-MM-DD',   // primeiro dia com dado no arquivo
             hoje:'AAAA-MM-DD',     // último; é o teto do seletor de datas
             grao:'dia' },

     // --- cadastro: atributos que NÃO dependem do período ---
     clientes: [{
       nome, cs, status:'ativo'|'inativo', integracao, plano,
       canal,                       // parceiro dono da conta: Vesti, Attasoft, Uemtel…
       dataCadastro:'AAAA-MM-DD',   // entrada na Vesti (criação do domínio)
       ultimoAcesso:'AAAA-MM-DD',   // login na PLATAFORMA VESTI (não é o Tino)
       ultimoPedido:'AAAA-MM-DD',
       vencimento:'AAAA-MM-DD',
       riscoChurn:'Alto'|'Médio'|'Baixo',
       dataChurn:'AAAA-MM-DD'|null  // preenchido só para quem cancelou
     }],

     // --- séries DIÁRIAS: é daqui que a tabela geral é agregada ---
     // `data` é 'AAAA-MM-DD'. O painel filtra por janela de datas e agrupa em
     // dia/semana/mês só na hora de desenhar. `dominio` é a chave da agregação
     // (28 marcas da carteira têm nome repetido).
     clientesSeries: [{ data, cliente, dominio, pedidos, valorPedidos,
                        receitaInterchange, receitaMensalidade, receitaAntecipacao }],

     // --- HubSpot: cross-sell e upsell vivem juntos em "negócios" ---
     // o produto vem no nome do negócio ("Oráculo — Marca", "Filial — Marca"…)
     // e é ele que define a categoria. Fechado = somente status 'Ganho'.
     negocios: [{ cliente, produto, negocio, categoria:'cross'|'up',
                  valor, status:'Ganho'|'Perdido'|'Em aberto', data }],

     oraculo:   { tabela:[{ cliente, cs, implantado, implantadoOrigem, pctIA,
                            atendimentos, gmvIniciado, gmvFinalizado }],
                  series:[{ data, cliente, atendimentos, gmvIniciado, gmvFinalizado }] },
     tino:      { tabela:[{ cliente, cs, implantado, eventos, eventosAno, sessoesAno, diasAcesso,
                            ultimoAcessoTino, statusTino, nuncaUsou, nuncaLogou,
                            semCadastro, foraDaCarteira }],
                  series:[{ data, cliente, cs, eventos, receita }],
                  kpis:{ total_brands, active_brands, never_accessed },
                  tiposDeEvento:[{ event_type, cnt }] },
     vestiPago: { tabela:[{ cliente, cs, implantado, valorTransacionado, receitaFee,
                            receitaAntecipacao, linksGerados, linksPagos }],
                  series:[{ data, cliente, linksGerados, linksPagos, valor }] },
     churn:     { series:[{ data, cliente, churns }] },   // tabela vem de `clientes`

     // --- bonificação: já agregada por CS e por mês, direto do fetcher ---
     // `base` é o valor do comparativo que a regra pede (marca d'água do CS ou
     // mesmo mês do ano passado); null quando a regra não compara.
     bonificacao: { meses:['AAAA-MM'],
                    metricas:[{ k, titulo, unidade, comparacao, regra }],
                    linhas:[{ mes, cs, k, valor, base }],
                    detalhe:[{ mes, cs, k, cliente, valor }] },
     reunioes:  [{ reuniao, data, cliente, cs, valor,
                   resultado:'Fechou negócio'|'Sem negócio'|'Agendada', negocio }],
     tickets:   [{ ticket, cliente, canal, pipeline, estagio,
                   situacao:'Aberto'|'Encerrado', categoria, prioridade, origem,
                   cs, data, fechadoEm, diasParaFechar }]
   }

   Obs.: as séries chegam EMPACOTADAS (formato colunar), e `desempacotar()` as
   devolve a este formato no boot. Ver `empacotar` no fetch_dados.js.

   Obs.: o campo `cliente` dentro de `series` é o que permite os gráficos
   responderem aos filtros de cliente e de CS. Se a série vier agregada
   (sem cliente), o gráfico simplesmente ignora esses filtros.
   ========================================================================== */

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* Catálogo de produtos do HubSpot. `cat` é o que separa a aba Cross-sell da
   aba Upsell: produto novo na conta = cross; expansão do que já existe = up.
   Trocar a classificação aqui reflete nas duas abas de uma vez. */
const PRODUTOS = [
  {nome:'Oráculo',          cat:'cross'},
  {nome:'Tino',             cat:'cross'},
  {nome:'VestiPago',       cat:'cross'},
  {nome:'Módulo Fiscal',    cat:'cross'},
  {nome:'Antecipação',      cat:'cross'},
  {nome:'Filial',           cat:'up'},
  {nome:'Multiloja',        cat:'up'},
  {nome:'Upgrade de plano', cat:'up'},
  {nome:'Pacote de volume', cat:'up'},
];

/* Dados reais vêm de dados.js (window.PAINEL_DATA). O mock abaixo só entra
   quando esse arquivo não foi gerado ainda — serve para abrir o layout sozinho. */
const DADOS_REAIS = !!(window.PAINEL_DATA && window.PAINEL_DATA.clientes && window.PAINEL_DATA.clientes.length);

const MOCK = (function buildMock(){
  const r = rng(20260813);
  const SEMANA_ATUAL = 33, ANO = 2026;
  const CS_TIME = ['Luana','Thamiris','Gabriella'];
  const nomes = [
    ['Ateliê Marfim','Shopify','Enterprise'],['Corsário Denim','VTEX','Pro'],
    ['Modare Confecções','Nuvemshop','Pro'],['Bendita Costura','API própria','Essencial'],
    ['Zaffira Store','Shopify','Pro'],['Norte Têxtil','Bling','Enterprise'],
    ['Casa Lumière','VTEX','Enterprise'],['Praiê Beachwear','Nuvemshop','Essencial'],
    ['Toca do Linho','Tray','Essencial'],['Vellore Uniformes','API própria','Pro'],
    ['Iaiá Modas','Nuvemshop','Essencial'],['Ponto Alto Malhas','Bling','Pro'],
  ];
  const pick=(a)=>a[Math.floor(r()*a.length)];
  const int=(a,b)=>Math.floor(a+r()*(b-a+1));
  const dia=(d)=>{const x=new Date(2026,7,13);x.setDate(x.getDate()-d);return x.toISOString().slice(0,10)};

  /* --- cadastro --- */
  const clientes = nomes.map(([nome,integracao,plano],i)=>{
    const inativo = i===8 || i===10;
    const semAcesso = inativo?int(34,80):int(0,12);
    /* guardado como número porque o racional do risco precisa dos DIAS, e
       `diasDe` ainda não pode ser chamado aqui: ela usa o `hoje`, que só é
       declarado mais abaixo no arquivo. */
    const semPedido = inativo?int(30,70):int(0,6);
    return {
      nome, cs: CS_TIME[i%CS_TIME.length],
      status: inativo?'inativo':'ativo', integracao, plano,
      dataCadastro: dia(int(120, 3200)),   // de ~4 meses a ~9 anos de casa
      ultimoAcesso: dia(semAcesso),
      ultimoPedido: dia(semPedido),
      _semPedido: semPedido,
      vencimento: '2026-09-'+String(int(1,28)).padStart(2,'0'),
      riscoChurn: 'Baixo',   // recalculado abaixo, depois de definir quem cancelou
      dataChurn: null,
      temTino: r()<0.6, temOraculo: r()<0.45, temVestiPago: r()<0.5,
      _semAcesso: semAcesso, _plano: plano, _inativo: inativo,
    };
  });

  /* O mock passou a gerar DIA a dia, como o dado real. As funções de forma
     continuam pensando em semana (é a escala em que foram escritas): recebem o
     número da semana e têm o resultado dividido pelos sete dias, com uma
     variação para o gráfico não sair reto. */
  const diasDoAno = (()=>{
    const out = [], fim = new Date(Date.UTC(ANO,0,1+(SEMANA_ATUAL*7)-1));
    for(let d = new Date(Date.UTC(ANO,0,1)); d <= fim; d.setUTCDate(d.getUTCDate()+1))
      out.push(d.toISOString().slice(0,10));
    return out;
  })();
  const semanaDoDia = iso => Math.max(1, Math.ceil((Math.round(
    (Date.parse(iso+'T00:00:00Z') - Date.UTC(ANO,0,1))/864e5) + 1)/7));
  const serie = (fn)=>{const out=[];clientes.forEach((c,ci)=>{diasDoAno.forEach(dt=>{
    const base = fn(c, semanaDoDia(dt), ci), linha = {data:dt, cliente:c.nome};
    for(const k in base){
      const v = base[k];
      linha[k] = typeof v==='number' ? Math.round(v/7*(0.5+r())) : v;
    }
    out.push(linha);
  })});return out};

  /* --- séries semanais da carteira (base da tabela geral) --- */
  const clientesSeries = serie((c)=>{
    const base = c._inativo?int(1,4):int(6,70);
    const ticket = 120+r()*480;
    const valor = Math.round(base*ticket);
    const mensal = c._plano==='Enterprise'?int(560,980):c._plano==='Pro'?int(210,380):int(68,128);
    return {
      pedidos: base,
      valorPedidos: valor,
      receitaInterchange: Math.round(valor*(0.006+r()*0.008)),
      receitaMensalidade: mensal,
      receitaAntecipacao: Math.round(valor*(0.002+r()*0.006)),
    };
  });

  /* --- negócios do HubSpot (cross-sell + upsell juntos) --- */
  const STATUS_DEAL = ['Ganho','Ganho','Ganho','Perdido','Perdido','Em aberto'];
  const negocios = Array.from({length:44},()=>{
    const c = pick(clientes), p = pick(PRODUTOS);
    return {
      cliente: c.nome, produto: p.nome, categoria: p.cat,
      negocio: p.nome+' — '+c.nome,
      valor: int(900,18000),
      status: pick(STATUS_DEAL),
      data: dia(int(0,150)),
      cs: c.cs,
    };
  }).sort((a,b)=>b.data.localeCompare(a.data));

  /* --- produtos --- */
  const oraculoSeries = serie((c,s)=>{
    const base = c._inativo?6:14+Math.round(30*Math.sin(s/9)+s*1.6);
    const at = Math.max(3, base+int(-8,10));
    const gmvIni = Math.round(at*(180+r()*260));
    return { atendimentos:at, atendimentosIA: Math.round(at*(0.52+r()*0.4)),
             gmvIniciado:gmvIni, gmvFinalizado: Math.round(gmvIni*(0.34+r()*0.32)) };
  });
  const tinoSeries = serie((c,s)=>{
    const ev = Math.max(4, Math.round(18+s*1.1+int(-9,12)) * (c._plano==='Enterprise'?2:1));
    return { eventos:ev, receita: Math.round(ev*(6+r()*7)) };
  });
  const pagoSeries = serie((c,s)=>{
    const ger = Math.max(2, Math.round(12+s*0.8+int(-5,9)));
    const pagos = Math.max(1, Math.round(ger*(0.42+r()*0.36)));
    const valor = Math.round(pagos*(320+r()*640));
    return { linksGerados:ger, linksPagos:pagos, valor,
             receitaFee: Math.round(valor*0.0129), receitaAntecipacao: Math.round(valor*0.0034) };
  });
  // probabilidade cresce um pouco ao longo do ano para que sempre caiam
  // cancelamentos dentro das últimas semanas — senão a aba abre vazia.
  const churnSeries = serie((c,s)=>({ churns: r() < (0.004 + s*0.0005)/7 ? 7 : 0 }));

  /* marca quem efetivamente cancelou (a 1ª ocorrência de cada cliente) e
     mantém o cadastro coerente: quem cancelou fica inativo. */
  const jaChurnou = new Set();
  churnSeries.forEach(x=>{
    if(!x.churns) return;
    if(jaChurnou.has(x.cliente)){ x.churns = 0; return }
    jaChurnou.add(x.cliente);
    const c = clientes.find(k=>k.nome===x.cliente);
    if(c){ c.dataChurn = x.data; c.status = 'inativo' }
  });

  /* risco só faz sentido para quem ainda está na base */
  clientes.forEach(c=>{
    /* Inadimplência é fato, então vale inclusive para quem cancelou — igual ao
       dado real. Só o risco é que fica null para quem já saiu. */
    const venc = r()<0.13 ? int(1,3) : 0;
    c.faturasVencidas = venc;
    c.diasAtraso = venc ? int(1,90) : null;
    c.valorEmAberto = venc ? int(300,4500) : 0;
    c.vencMaisAntigo = venc ? dia(c.diasAtraso) : null;
    c.inadimplente = venc>0 && c.diasAtraso>=10;
    c.diasSemPedido = c._semPedido;

    if(c.dataChurn){ c.riscoChurn = null; c.motivosRisco = []; return }
    const d = c._semAcesso;
    c.riscoChurn = (c.inadimplente || d>30) ? 'Alto' : d>12 ? 'Médio' : (r()<0.25?'Alto':r()<0.55?'Médio':'Baixo');
    c.motivosRisco = [
      c.diasSemPedido>15 ? 'sem pedido há '+c.diasSemPedido+' dias' : null,
      venc ? venc+(venc>1?' faturas vencidas':' fatura vencida')+' há '+c.diasAtraso+' dias' : null,
      d>30 ? 'sem acesso há '+d+' dias' : null,
    ].filter(Boolean);
  });

  const porCliente=(arr,k)=>{const m={};arr.forEach(x=>{m[x.cliente]=(m[x.cliente]||0)+x[k]});return m};
  const csDe = (nome)=>(clientes.find(c=>c.nome===nome)||{}).cs;

  const at=porCliente(oraculoSeries,'atendimentos'),
        gi=porCliente(oraculoSeries,'gmvIniciado'),
        gf=porCliente(oraculoSeries,'gmvFinalizado');
  const oraculoTab = clientes.map(c=>({
    cliente:c.nome, cs:c.cs, pctIA: Math.round(52+r()*40),
    atendimentos: at[c.nome], gmvIniciado: gi[c.nome], gmvFinalizado: gf[c.nome]
  }));

  const ev=porCliente(tinoSeries,'eventos');
  const tinoTab = clientes.map(c=>({
    cliente:c.nome, cs:c.cs, eventos: ev[c.nome],
    eventosAno: ev[c.nome], sessoesAno: Math.max(1,Math.round(ev[c.nome]/6)), diasAcesso: int(0,60),
    ultimoAcessoTino: dia(-int(0,40)), statusTino:'Ativa', nuncaUsou:false, semCadastro:false
  }));

  const lg=porCliente(pagoSeries,'linksGerados'),
        lp=porCliente(pagoSeries,'linksPagos'),
        vl=porCliente(pagoSeries,'valor');
  const pagoTab = clientes.map(c=>({
    cliente:c.nome, cs:c.cs,
    valorTransacionado: vl[c.nome],
    receitaFee: Math.round(vl[c.nome]*0.0129),
    receitaAntecipacao: Math.round(vl[c.nome]*(0.0034+r()*0.004)),
    linksGerados: lg[c.nome], linksPagos: lp[c.nome]
  }));

  const tipos=['Reunião de acompanhamento','Onboarding','Renovação','Alinhamento trimestral','Treinamento','Revisão de plano'];
  const reunioes = Array.from({length:52},()=>{
    const tipo=pick(tipos), c=pick(clientes), data=dia(int(-14,20));
    const resultado = data>dia(0) ? 'Agendada' : (r()<0.25?'Fechou negócio':'Sem negócio');
    return { reuniao: tipo, data, cliente: c.nome, cs: c.cs, resultado,
             negocio: resultado==='Fechou negócio' ? 'Upgrade de plano — '+c.nome : null,
             valor: resultado==='Fechou negócio' ? int(400,4000) : 0 };
  }).sort((a,b)=>b.data.localeCompare(a.data));

  clientes.forEach(c=>{ delete c._plano; delete c._inativo; delete c._semAcesso; delete c._semPedido });

  return {
    meta:{ ano:ANO, semanaAtual:SEMANA_ATUAL, cs:CS_TIME, diasChurn:45, diasInadimplencia:10,
           inicio:ANO+'-01-01', hoje:diasDoAno[diasDoAno.length-1], grao:'dia' },
    clientes, clientesSeries, negocios,
    oraculo:{ tabela:oraculoTab, series:oraculoSeries },
    tino:{ tabela:tinoTab, series:tinoSeries },
    vestiPago:{ tabela:pagoTab, series:pagoSeries },
    churn:{ series:churnSeries },
    reunioes
  };
})();

/* As séries diárias chegam em formato colunar (ver `empacotar` no fetch_dados.js):
   uma lista de colunas, um dicionário por coluna de texto e uma matriz de valores.
   Sem isso o dados.js passaria de 35 MB, porque o nome do cliente e o do campo se
   repetem em cada uma das ~78 mil linhas. Aqui ele volta a ser lista de objetos —
   nenhuma outra parte do painel precisa saber que houve empacotamento. */
function desempacotar(o){
  if(Array.isArray(o)) return o;
  if(!o || typeof o!=='object') return o;
  if(o._p===1 && Array.isArray(o.c) && Array.isArray(o.r)){
    const cols = o.c, dic = o.dic || {};
    return o.r.map(linha=>{
      const obj = {};
      for(let i=0;i<cols.length;i++){
        const k = cols[i]; let v = linha[i];
        const d = dic[k];
        if(d && typeof v==='number') v = d[v];
        obj[k] = v;
      }
      return obj;
    });
  }
  for(const k in o) o[k] = desempacotar(o[k]);
  return o;
}

/* Rede de segurança para a virada de formato (26/08/2026): o layout novo é
   publicado por `publicar.js` e o dados.js por um workflow que roda de
   madrugada, então existe uma janela em que o painel novo abre com o arquivo
   velho, ainda no grão de semana. Em vez de mostrar tudo zerado, cada linha
   antiga vira a segunda-feira da semana dela — o número do mês fica aproximado
   (a semana da virada cai inteira num mês só) e a próxima carga arruma. */
function converterSemanaEmData(o){
  const ano = (o.meta && o.meta.ano) || new Date().getFullYear();
  const daSemana = s => {
    const base = new Date(Date.UTC(ano,0,4));
    const seg = new Date(base);
    seg.setUTCDate(base.getUTCDate() - ((base.getUTCDay()+6)%7) + (Number(s)-1)*7);
    return seg.toISOString().slice(0,10);
  };
  let convertidas = 0;
  const arruma = arr => {
    if(!Array.isArray(arr)) return arr;
    arr.forEach(x=>{ if(x && x.data==null && x.semana!=null){ x.data = daSemana(x.semana); convertidas++ } });
    return arr;
  };
  arruma(o.clientesSeries);
  ['oraculo','tino','vestiPago','churn'].forEach(k=>{ if(o[k]) arruma(o[k].series) });
  if(convertidas) console.warn('Painel: dados.js ainda está no formato de semana ('
    + convertidas + ' linhas convertidas). Os números ficam aproximados até a próxima carga.');
  return o;
}

const DATA = converterSemanaEmData(desempacotar(DADOS_REAIS ? window.PAINEL_DATA : MOCK));

/* Campos novos (canal, tickets, reuniões, Tino por API) podem faltar no mock e
   num dados.js antigo: o painel abre do mesmo jeito, só com a aba e o filtro
   vazios. */
if(!DATA.tickets) DATA.tickets = [];
if(!DATA.reunioes) DATA.reunioes = [];
if(!DATA.tino) DATA.tino = {tabela:[], series:[]};
if(!DATA.tino.kpis) DATA.tino.kpis = {};
DATA.clientes.forEach(c=>{ if(!c.canal) c.canal = 'Sem canal' });
/* "VestiPago" virou palavra só (Laura, 31/08/2026). O dados.js escreve o rótulo
   da coluna de bonificação, e a carga que reescreve esse arquivo só roda de
   madrugada — normalizar aqui faz o nome novo valer já nesta abertura, em vez
   de amanhã. Quando o arquivo já vier certo, o replace não acha nada. */
const umNomeSo = t => String(t||'').replace(/Vesti\s+Pago/g,'VestiPago');
(DATA.bonificacao?.metricas || []).forEach(m=>{ if(m && m.titulo) m.titulo = umNomeSo(m.titulo) });
if(DATA.meta.avisos) for(const k in DATA.meta.avisos) DATA.meta.avisos[k] = umNomeSo(DATA.meta.avisos[k]);
if(!DATA.meta.canais){
  DATA.meta.canais = [...new Set(DATA.clientes.map(c=>c.canal))]
    .sort((a,b)=> a==='Sem canal' ? 1 : b==='Sem canal' ? -1 : a.localeCompare(b,'pt-BR'));
}

/* ============================================================================
   2. FORMATADORES
   ========================================================================== */
const nfInt = new Intl.NumberFormat('pt-BR');
const nfMoney = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const nfMoneyC = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const fmt = {
  int:v=>nfInt.format(v||0),
  money:v=>nfMoney.format(v||0),
  moneyC:v=>nfMoneyC.format(v||0),
  pct:v=>(v==null?'—':nfInt.format(v)+'%'),
  /* Uma casa decimal, para a variação % da aba de Bonificação: com números
     grandes de GMV, arredondar para inteiro esconde meio ponto de crescimento. */
  pct1:v=>(v==null?'—':(Math.abs(v)>=100?nfInt.format(Math.round(v)):v.toFixed(1).replace('.',','))+'%'),
  date:v=>v?v.split('-').reverse().join('/'):'—',
  compact:v=>{const a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(a>=1e7?0:1).replace('.',',')+'M';if(a>=1e3)return (v/1e3).toFixed(a>=1e4?0:1).replace('.',',')+'k';return nfInt.format(v)},
  moneyCompact:v=>'R$ '+fmt.compact(v),
  wk:s=>'S'+String(s).padStart(2,'0'),
  /* '05/ago' — rótulo curto de dia, para o eixo dos gráficos e a régua. */
  dia:iso=>{ if(!iso) return '—'; const [,m,d]=iso.split('-'); return d+'/'+MESES[Number(m)-1] },
  /* 'ago/26' — rótulo de mês, para quando o período é longo demais para dias. */
  mes:iso=>{ if(!iso) return '—'; const [y,m]=iso.split('-'); return MESES[Number(m)-1]+'/'+String(y).slice(2) },
};
/* Hoje de verdade. Era uma data fixa (13/08/2026) de quando o painel foi
   escrito; com a carga rodando todo dia às 04:00 BRT, "há X dias", "atrasada"
   e tempo de casa precisam andar junto com o calendário. */
const hoje = (()=>{ const d=new Date(); d.setHours(0,0,0,0); return d })();
function diasDe(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return Math.round((hoje-new Date(y,m-1,d))/864e5); }
function relativo(iso){
  const d = diasDe(iso); if(d==null) return {txt:'—',cls:''};
  const cls = d<=7?'h-ok':d<=30?'h-warn':'h-bad';
  const txt = d<0?'em '+Math.abs(d)+' d':d===0?'hoje':d===1?'ontem':'há '+d+' dias';
  return {txt,cls};
}
/* "3a 2m", "7m", "há 12 d" — tempo desde o cadastro, em passo grosso. */
function tempoDeCasa(iso){
  const d = diasDe(iso); if(d==null) return '';
  const meses = Math.floor(d/30.44);
  if(meses < 1) return 'há '+Math.max(d,0)+' d';
  if(meses < 12) return meses+' '+(meses===1?'mês':'meses');
  const anos = Math.floor(meses/12), resto = meses%12;
  return anos+'a'+(resto?' '+resto+'m':'');
}
/* ============================================================================
   3. AGREGAÇÕES DEPENDENTES DE PERÍODO
   ========================================================================== */
/* O período é uma JANELA DE DATAS: início e fim, inclusive nos dois extremos.
   Era uma seleção de semanas ISO até 26/08/2026, e mudou por um motivo prático
   levantado pela Laura: semana ISO atravessa a virada do mês — a semana 31 de
   2026 começa em 27/julho e termina em 2/agosto — então nenhum recorte semanal
   fechava um mês. Agora quem pergunta "e agosto?" escolhe 01/08 a 31/08 e
   recebe agosto, sem sobra do mês vizinho. */
function periodo(){ return estado.filtros.periodo }
function dentroDaJanela(d){
  if(!d) return false;
  const p = estado.filtros.periodo;
  const iso = String(d).slice(0,10);
  return iso >= p.ini && iso <= p.fim;
}
/* Primeiro e último dia com dado no arquivo. O seletor não deixa sair daqui:
   escolher janeiro do ano passado devolveria uma tela vazia sem explicação. */
const LIMITE_DADOS = (()=>{
  const meta = DATA.meta || {};
  const ano = meta.ano || new Date().getFullYear();
  return { ini: ano+'-01-01', fim: meta.hoje || hojeIso() };
})();
function hojeIso(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10) }
const diasEntre = (a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
function somarDias(iso,n){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10) }
function primeiroDiaDoMes(iso){ return iso.slice(0,7)+'-01' }
function ultimoDiaDoMes(iso){
  const [y,m]=iso.split('-').map(Number);
  return new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10);
}
/* Janela travada no que existe no arquivo — o seletor pode pedir "últimos 90
   dias" em fevereiro e cair antes do começo da série. */
function janela(ini, fim){
  return { ini: ini < LIMITE_DADOS.ini ? LIMITE_DADOS.ini : ini,
           fim: fim > LIMITE_DADOS.fim ? LIMITE_DADOS.fim : fim };
}
/* Atalhos do seletor. "Mês passado" é o que motivou a mudança toda. */
function periodosProntos(){
  const h = LIMITE_DADOS.fim;
  const mesPassado = somarDias(primeiroDiaDoMes(h), -1);
  return [
    ['Este mês',      janela(primeiroDiaDoMes(h), h)],
    ['Mês passado',   janela(primeiroDiaDoMes(mesPassado), ultimoDiaDoMes(mesPassado))],
    ['Últimos 30 dias', janela(somarDias(h,-29), h)],
    ['Últimos 90 dias', janela(somarDias(h,-89), h)],
    ['Ano todo',      janela(LIMITE_DADOS.ini, h)],
  ];
}

const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* Período de abertura do painel: os últimos 90 dias. Antes eram 12 semanas —
   é a mesma ordem de grandeza, agora contada em dias corridos. */
function periodoPadrao(){ return janela(somarDias(LIMITE_DADOS.fim,-89), LIMITE_DADOS.fim) }

/* Rótulo curto do período, usado no botão do filtro, na régua e no topo.
   Quando a janela é exatamente um mês-calendário, o nome do mês diz mais que
   duas datas ("agosto de 2026" em vez de "01/08 – 31/08"). */
function rotuloPeriodo(p){
  const p2 = p || periodo();
  if(p2.ini === primeiroDiaDoMes(p2.ini) && p2.fim === ultimoDiaDoMes(p2.ini)
     && p2.ini.slice(0,7) === p2.fim.slice(0,7)){
    return MESES_LONGOS[Number(p2.ini.slice(5,7))-1] + ' de ' + p2.ini.slice(0,4);
  }
  return fmt.date(p2.ini) + ' – ' + fmt.date(p2.fim);
}
const MESES_LONGOS = ['janeiro','fevereiro','março','abril','maio','junho','julho',
                      'agosto','setembro','outubro','novembro','dezembro'];
/* '2026-08' -> 'agosto de 2026' */
function rotuloMes(m){
  if(!m) return '—';
  return MESES_LONGOS[Number(m.slice(5,7))-1] + ' de ' + m.slice(0,4);
}

/* Tabela geral: agrega as séries semanais dentro do período e junta ao cadastro. */
function clientesAgregados(){
  const acc = {};
  /* Chave por DOMÍNIO, não por nome. 28 marcas da carteira dividem o nome com
     outra (mesmo apelido, domínios diferentes: "Anisa", "Morina", "Di Luise"…),
     e somando por nome as duas linhas recebiam o total das duas — R$ 684 mil a
     mais só em julho de 2026. O domínio passou a viajar na série quando o grão
     virou dia, e é ele que resolve. Nome continua valendo de reserva, para
     linha antiga que não tenha domínio. */
  const chave = x => x.dominio || x.cliente;
  DATA.clientesSeries.forEach(x=>{
    if(!dentroDaJanela(x.data)) return;
    const k = chave(x);
    const a = acc[k] || (acc[k] = {pedidos:0,valorPedidos:0,receitaInterchange:0,receitaMensalidade:0,receitaOutrosIugu:0,receitaAntecipacao:0});
    a.pedidos+=x.pedidos; a.valorPedidos+=x.valorPedidos;
    a.receitaInterchange+=x.receitaInterchange;
    a.receitaMensalidade+=x.receitaMensalidade;
    a.receitaOutrosIugu+=(x.receitaOutrosIugu||0);
    a.receitaAntecipacao+=x.receitaAntecipacao;
  });
  return DATA.clientes.map(c=>{
    const a = acc[c.dominio] || acc[c.nome]
      || {pedidos:0,valorPedidos:0,receitaInterchange:0,receitaMensalidade:0,receitaOutrosIugu:0,receitaAntecipacao:0};
    return Object.assign({}, c, a, {
      ticketMedio: a.pedidos ? Math.round(a.valorPedidos/a.pedidos*100)/100 : 0,
      // total = tudo que a marca gerou de receita para a Vesti no período
      receitaTotal: Math.round((a.receitaInterchange + a.receitaMensalidade
                              + a.receitaOutrosIugu + a.receitaAntecipacao)*100)/100,
    });
  });
}

/* CS de cada cliente, para as tabelas de produto herdarem o responsável. */
const CS_POR_CLIENTE = (()=>{ const m={}; DATA.clientes.forEach(c=>m[c.nome]=c.cs); return m })();
/* Canal de cada cliente, para as abas que agregam por nome (produtos, churn)
   responderem ao filtro de canal sem carregar a coluna. */
const CANAL_POR_CLIENTE = (()=>{ const m={}; DATA.clientes.forEach(c=>m[c.nome]=c.canal); return m })();
/* CS por domínio: onde a linha tem id, ele é chave melhor que o nome — 28
   marcas da carteira são homônimas de outra. */
const CS_POR_DOM = (()=>{ const m={}; DATA.clientes.forEach(c=>{ if(c.dominio) m[c.dominio]=c.cs }); return m })();
/* Domínio de cada cliente. As abas que agregam por nome montam linhas novas e
   perdem os campos que não somam, então o id é recuperado por aqui. */
const DOM_POR_CLIENTE = (()=>{ const m={}; DATA.clientes.forEach(c=>{ if(c.dominio) m[c.nome]=c.dominio }); return m })();

/* Responsável de uma linha, para o filtro de CS valer em qualquer aba: em
   Reuniões e Tickets é o dono do registro no HubSpot; nas demais é o CS da
   carteira, com o nome da própria linha como reserva. */
function csDaLinha(t,r){
  const chave = t.chaveCliente || 'cliente';
  return normalizarCs(r.cs) || CS_POR_CLIENTE[r[chave]] || 'Sem CS';
}
/* O HubSpot grava o mesmo responsável com nome curto na carteira e completo no
   dono do registro ("Jennyfer Rabelo" × "Jennyfer Rabelo dos Santos"). Sem
   juntar os dois, a mesma pessoa apareceria como dois filtros. */
const NOMES_CS = [...new Set(DATA.clientes.map(c=>c.cs))].filter(n=>n && n!=='Sem CS');
function normalizarCs(n){
  if(!n) return '';
  return NOMES_CS.find(c=>c!==n && (n.startsWith(c+' ') || c.startsWith(n+' '))) || n;
}
/* Lista de responsáveis oferecida pelo filtro: sai das linhas da própria aba,
   assim o seletor nunca oferece um nome que não devolve nada. */
function csDaAba(t){
  const fonte = ['reunioes','tickets','crossSell','upsell'].includes(t.id)
    ? t.linhas().map(r=>csDaLinha(t,r))
    : DATA.clientes.map(c=>c.cs || 'Sem CS');
  return [...new Set(fonte)].filter(Boolean).sort((a,b)=>
    /^\(?Sem/i.test(a) ? 1 : /^\(?Sem/i.test(b) ? -1 : a.localeCompare(b,'pt-BR'));
}

/* Devolve à linha agregada os campos que não somam (data de implantação, e o
   que mais o cadastro da aba trouxer), casando pelo domínio e, na falta dele,
   pelo nome do cliente. */
function juntarCadastro(linhas, cadastro, campos){
  const porDom = new Map(), porNome = new Map();
  (cadastro||[]).forEach(c=>{ if(c.dominio) porDom.set(c.dominio,c); if(c.cliente) porNome.set(c.cliente,c) });
  return linhas.map(l=>{
    const c = (l.dominio && porDom.get(l.dominio)) || porNome.get(l.cliente);
    if(!c) return l;
    campos.forEach(k=>{ if(l[k]==null) l[k]=c[k] });
    return l;
  });
}

/* As abas de produto também respeitam o Período: a tabela é somada a partir
   da série diária, e não de um total anual pré-calculado. Sem isso o filtro
   de período mexeria só nos gráficos e a tabela mentiria. */
function agregarPorCliente(series, campos, derivar){
  const acc = {};
  /* Mesma régua da tabela geral: agrega por domínio, com o nome de reserva —
     senão duas marcas homônimas viram uma linha com o dobro. */
  series.forEach(x=>{
    if(!dentroDaJanela(x.data)) return;
    const k = x.dominio || x.cliente;
    const a = acc[k] || (acc[k] = {cliente:x.cliente,
      cs:x.cs || CS_POR_DOM[x.dominio] || CS_POR_CLIENTE[x.cliente] || 'Sem CS',
      dominio:x.dominio||DOM_POR_CLIENTE[x.cliente]||null});
    if(!a.dominio && x.dominio) a.dominio = x.dominio;
    campos.forEach(k=>a[k]=(a[k]||0)+(Number(x[k])||0));
  });
  const out = Object.values(acc);
  out.forEach(a=>{ campos.forEach(k=>a[k]=Math.round((a[k]||0)*100)/100); if(derivar) derivar(a) });
  return out;
}

/* Churn: cancelados + inadimplentes + clientes ativos em risco.
   Uma marca só aparece uma vez, na situação mais grave que couber nela:
   Cancelado > Inadimplente > Em risco. Sem essa prioridade a mesma marca sairia
   duas vezes em "Todos" (quem está inadimplente costuma estar em risco também)
   e a contagem do topo deixaria de bater com a tabela. */
function situacaoDe(c){
  if(c.dataChurn) return 'Cancelado';
  if(c.inadimplente) return 'Inadimplente';
  return 'Em risco';
}

function linhasChurn(){
  const sit = estado.filtros.situacao;
  const out = DATA.clientes.map(c=>({
    cliente:c.nome, dominio:c.dominio, cs:c.cs, plano:c.plano,
    data:c.dataChurn||null, riscoChurn:c.riscoChurn, situacao:situacaoDe(c),
    /* o racional, em coluna — é o que responde "risco baseado em quê?" */
    motivosRisco:c.motivosRisco||[], diasSemPedido:c.diasSemPedido??null,
    ultimoPedido:c.ultimoPedido||null,
    faturasVencidas:c.faturasVencidas||0, valorEmAberto:c.valorEmAberto||0,
    diasAtraso:c.diasAtraso??null, vencMaisAntigo:c.vencMaisAntigo||null,
  }));
  const filtrado = sit==='Cancelado'    ? out.filter(x=>x.situacao==='Cancelado')
                 : sit==='Inadimplente' ? out.filter(x=>x.situacao==='Inadimplente')
                 /* "Em risco" esconde quem está Baixo: a lista existe para
                    virar trabalho da CS, e risco baixo não vira ligação. */
                 : sit==='Em risco'     ? out.filter(x=>x.situacao==='Em risco' && x.riscoChurn!=='Baixo')
                 : out;
  const ordemRisco = {Alto:0, 'Médio':1, Baixo:2};
  return filtrado.sort((a,b)=>{
    /* cancelado primeiro (mais recente no topo), depois inadimplente pelo
       maior atraso, depois o resto pelo risco. */
    if(a.data && b.data) return b.data.localeCompare(a.data);
    if(a.data) return -1;
    if(b.data) return 1;
    const ia = a.situacao==='Inadimplente', ib = b.situacao==='Inadimplente';
    if(ia && ib) return (b.diasAtraso||0)-(a.diasAtraso||0);
    if(ia) return -1;
    if(ib) return 1;
    return (ordemRisco[a.riscoChurn]??9)-(ordemRisco[b.riscoChurn]??9);
  });
}

/* ============================================================================
   4. CONFIGURAÇÃO DAS ABAS
   ========================================================================== */
const COL_CS = {k:'cs', l:'CS', tipo:'cs'};

/* Negócios de uma categoria com o responsável resolvido: o dono do negócio no
   HubSpot vem primeiro; sem ele, cai no CS da carteira daquela marca. */
function negociosDe(categoria){
  return DATA.negocios.filter(n=>n.categoria===categoria)
    .map(n=>Object.assign({}, n, {cs: normalizarCs(n.cs) || CS_POR_CLIENTE[n.cliente] || 'Sem CS'}));
}

/* ==========================================================================
   VISÃO GERAL — não mede nada de novo: junta números que já existem nas
   outras abas (clientes, clientesSeries, negocios, tickets, reunioes, tino,
   oraculo, vestiPago), comparando o período escolhido no filtro contra um
   período anterior de MESMO TAMANHO em dias corridos. Quem quiser "semana
   passada" ou "mês passado" escolhe isso no próprio seletor de período — a
   conta de "anterior" segue o mesmo recorte.
   ========================================================================== */
function periodoAnterior(p){
  p = p || periodo();
  const dias = diasEntre(p.ini, p.fim) + 1;
  return { ini: somarDias(p.ini, -dias), fim: somarDias(p.ini, -1) };
}
/* Starter/Pro sai do TEXTO do campo Plano (ex.: "Assinatura: Plano PRO"),
   não de um código — por isso é busca por trecho, não igualdade. */
function planoBucket(plano){
  const s = String(plano||'').toLowerCase();
  if(s.includes('starter')) return 'Starter';
  if(s.includes('pro')) return 'Pro';
  return 'Outro';
}
function novasVendasNoPeriodo(p){
  return DATA.clientes.filter(c=>c.dataCadastro>=p.ini && c.dataCadastro<=p.fim);
}
function churnsNoPeriodo(p){
  return DATA.clientes.filter(c=>c.dataChurn && c.dataChurn>=p.ini && c.dataChurn<=p.fim);
}
function reunioesNoPeriodo(p){
  return DATA.reunioes.filter(r=>r.data && r.data>=p.ini && r.data<=p.fim && r.resultado!=='Agendada');
}
function negociosGanhosNoPeriodo(categoria, p){
  return negociosDe(categoria).filter(n=>n.status==='Ganho' && n.data>=p.ini && n.data<=p.fim);
}
/* Mensalidade/pedidos por domínio numa janela QUALQUER — não dá para usar
   clientesAgregados(), que só enxerga o período global do filtro, porque aqui
   é preciso somar o período atual e o anterior ao mesmo tempo. */
function pedidosPorDominioEm(p){
  const acc = {};
  DATA.clientesSeries.forEach(x=>{
    const d = String(x.data).slice(0,10);
    if(d<p.ini || d>p.fim) return;
    const k = x.dominio || x.cliente;
    const a = acc[k] || (acc[k]={pedidos:0,valorPedidos:0});
    a.pedidos += x.pedidos||0; a.valorPedidos += x.valorPedidos||0;
  });
  return acc;
}
function implantadosNoPeriodo(p){
  const conta = tabela => tabela.filter(x=>x.implantado && x.implantado>=p.ini && x.implantado<=p.fim);
  return { tino: conta(DATA.tino.tabela), oraculo: conta(DATA.oraculo.tabela), vestiPago: conta(DATA.vestiPago.tabela) };
}
function marcasImplantadasNoPeriodo(p){
  const imp = implantadosNoPeriodo(p);
  return [...new Set([...imp.tino, ...imp.oraculo, ...imp.vestiPago].map(x=>x.cliente))];
}
/* Marcos de volume: só entre quem foi IMPLANTADO (Tino/Oráculo/VestiPago) no
   próprio período — é o ramp-up pós-implantação, não qualquer marca grande
   que já vendia R$100k por mês antes disso. */
function marcasAcima100k(p){
  const pedidosPorDom = pedidosPorDominioEm(p);
  return marcasImplantadasNoPeriodo(p).map(nome=>{
    const dom = DOM_POR_CLIENTE[nome];
    const a = pedidosPorDom[dom] || pedidosPorDom[nome] || {pedidos:0,valorPedidos:0};
    return {nome, cs: CS_POR_CLIENTE[nome]||'Sem CS', pedidos:a.pedidos, valor:a.valorPedidos};
  }).filter(x=>x.valor>=100000).sort((a,b)=>b.valor-a.valor);
}
/* Funil de onboarding: negócios em andamento nos pipelines de CS que têm um
   estágio "Implantado" — hoje são quatro (Sucesso do Cliente, Sucesso do
   cliente - Integração, Sucesso do Cliente - Plataforma, CS - Starter). NÃO é
   o pipeline de TICKET "Integrações" (esse tem 1 ticket, fechado, de março —
   não é o que alimenta isso). O fetch_dados.js já normaliza os nomes de
   estágio de cada pipeline (ex.: "Configurações" x "Cadastro de produtos",
   "Treinamento de vendas" x "1º/2º Treinamento") nas 5 fases abaixo. FOTO DO
   MOMENTO: é a contagem de negócios abertos agora em cada fase — os marcos de
   depois do "Implantado" (5/25 pedidos, R$100k) já são medidos direto dos
   pedidos pagos, no bloco "Marcos de volume". */
function funilIntegracoes(){
  const ORDEM = ['Novo cliente','Day one','Configuração','Treinamento','Implantado'];
  const porEstagio = {};
  (DATA.onboarding||[]).forEach(o=>{ porEstagio[o.estagio]=(porEstagio[o.estagio]||0)+1 });
  const cores = ['var(--acc)','var(--acc-2)','var(--gold)','var(--pos)','var(--ink-3)'];
  return ORDEM.map((l,i)=>({l, v:porEstagio[l]||0, cor:cores[i%cores.length]}));
}
function categoriasNovasVendas(){
  const p = periodo(), ant = periodoAnterior(p);
  const atual = novasVendasNoPeriodo(p), anterior = novasVendasNoPeriodo(ant);
  const conta = (lista,plano) => lista.filter(c=>planoBucket(c.plano)===plano).length;
  return [
    {l:'Starter — este período', v:conta(atual,'Starter'), cor:'var(--acc)'},
    {l:'Starter — período anterior', v:conta(anterior,'Starter'), cor:'var(--acc-2)'},
    {l:'Pro — este período', v:conta(atual,'Pro'), cor:'var(--acc)'},
    {l:'Pro — período anterior', v:conta(anterior,'Pro'), cor:'var(--acc-2)'},
    {l:'Outro — este período', v:conta(atual,'Outro'), cor:'var(--acc)'},
    {l:'Outro — período anterior', v:conta(anterior,'Outro'), cor:'var(--acc-2)'},
  ];
}
function categoriasImplantados(){
  const imp = implantadosNoPeriodo(periodo());
  return [
    {l:'Tino', v:imp.tino.length, cor:'var(--acc)'},
    {l:'Oráculo', v:imp.oraculo.length, cor:'var(--acc-2)'},
    {l:'VestiPago', v:imp.vestiPago.length, cor:'var(--gold)'},
  ];
}
function categoriasMarcos(){
  const p = periodo();
  const nomes = marcasImplantadasNoPeriodo(p);
  const pedidosPorDom = pedidosPorDominioEm(p);
  const linhas = nomes.map(nome=>{
    const dom = DOM_POR_CLIENTE[nome];
    return pedidosPorDom[dom] || pedidosPorDom[nome] || {pedidos:0,valorPedidos:0};
  });
  return [
    {l:'5+ pedidos pagos', v:linhas.filter(x=>x.pedidos>=5).length, cor:'var(--acc)'},
    {l:'25+ pedidos pagos', v:linhas.filter(x=>x.pedidos>=25).length, cor:'var(--acc-2)'},
    {l:'R$100k+ de GMV', v:linhas.filter(x=>x.valorPedidos>=100000).length, cor:'var(--gold)'},
  ];
}
function kpisVisaoGeral(){
  const p = periodo(), ant = periodoAnterior(p);
  const delta = (a,b)=> a>b ? `+${fmt.int(a-b)} vs período anterior`
    : a<b ? `${fmt.int(a-b)} vs período anterior` : 'igual ao período anterior';
  const novasAtual = novasVendasNoPeriodo(p).length, novasAnt = novasVendasNoPeriodo(ant).length;
  const churnAtual = churnsNoPeriodo(p).length, churnAnt = churnsNoPeriodo(ant).length;
  const reunAtual = reunioesNoPeriodo(p).length, reunAnt = reunioesNoPeriodo(ant).length;
  const negAtual = [...negociosGanhosNoPeriodo('cross',p), ...negociosGanhosNoPeriodo('up',p)];
  const negAnt = [...negociosGanhosNoPeriodo('cross',ant), ...negociosGanhosNoPeriodo('up',ant)];
  return [
    {l:'Novas vendas', v:fmt.int(novasAtual), s:delta(novasAtual,novasAnt)},
    {l:'Churn', v:fmt.int(churnAtual), s:delta(churnAtual,churnAnt)},
    {l:'Reuniões realizadas', v:fmt.int(reunAtual), s:delta(reunAtual,reunAnt)},
    {l:'Negócios ganhos (cross-sell + upgrade)', v:fmt.moneyCompact(soma(negAtual,'valor')),
     s:fmt.int(negAtual.length)+' negócios · '+delta(negAtual.length,negAnt.length)},
  ];
}
/* Segunda fileira de cards: as listas cruas por trás de cada número acima —
   mesma ideia da segunda tabela da Bonificação (renderPontos), só que aqui são
   quatro listas curtas em vez de uma tabela de pontuação. */
function renderListasVisaoGeral(){
  const p = periodo();
  const wrap = el('div',{class:'charts two'});

  const listaCard = (titulo, linhas, colunas) => {
    const card = el('div',{class:'table-card'});
    const head = el('div',{class:'table-head'});
    head.innerHTML = `<h3>${titulo}</h3><span class="count">${linhas.length} ${linhas.length===1?'registro':'registros'}</span>`;
    card.appendChild(head);
    if(!linhas.length){
      card.appendChild(el('div',{class:'empty'},
        `<h4>Nada por aqui no período</h4><p>Amplie o período no filtro acima para ver registros.</p>`));
      return card;
    }
    const scroll = el('div',{class:'table-scroll'});
    let html = '<table><thead><tr>'+colunas.map(c=>`<th${c.r?' class="r"':''}>${c.l}</th>`).join('')+'</tr></thead><tbody>';
    linhas.forEach(r=>{
      html += '<tr>'+colunas.map(c=>`<td${c.r?' class="r num"':''}>${c.f?c.f(r[c.k]):(r[c.k]??'—')}</td>`).join('')+'</tr>';
    });
    html += '</tbody></table>';
    scroll.innerHTML = html;
    card.appendChild(scroll);
    return card;
  };

  wrap.appendChild(listaCard('Novas vendas no período',
    novasVendasNoPeriodo(p).map(c=>({nome:c.nome, plano:planoBucket(c.plano), cs:c.cs, dataCadastro:c.dataCadastro})),
    [{k:'nome', l:'Cliente'}, {k:'plano', l:'Plano'}, {k:'cs', l:'CS'},
     {k:'dataCadastro', l:'Cadastro', f:fmt.date}]));

  wrap.appendChild(listaCard('Marcas com churn no período',

/* Catálogo das regras. Vem do dados.js (é o fetcher que sabe medir cada uma);
   a lista abaixo é só o que fazer se o arquivo for antigo e não tiver a aba. */
function METRICAS(){
  const b = DATA.bonificacao;
  return (b && b.metricas && b.metricas.length) ? b.metricas : [];
}

/* Uma linha por CS no mês escolhido, com o valor de cada regra, a base de
   comparação e a lista de marcas que entraram (vai no title da célula). */
/* Regras que comparam com a MARCA D'ÁGUA em vez do mês anterior (Laura,
   31/08/2026): o comparativo é o RECORDE do CS — o maior valor que ele já fez
   em um mês. O fetcher já grava essa base no dados.js, mas o painel recalcula a
   partir do histórico que veio junto: a carga que reescreve o dados.js só roda
   de madrugada, e sem isso a tela ficaria um dia inteiro mostrando a régua nova
   com a base velha. Com o arquivo já atualizado, os dois chegam ao mesmo
   número. */
const MARCA_DAGUA = new Set(['tino60','mensalidade','integracoesAtivas']);

function linhasBonificacao(){
  const b = DATA.bonificacao || {linhas:[], detalhe:[], meses:[]};
  const mes = mesBonificacao();
  const met = METRICAS();
  /* Recorde de cada CS ANTES do mês escolhido. O próprio mês fica de fora de
     propósito: incluí-lo faria a diferença ser sempre zero ou negativa e
     ninguém bateria a própria marca. Sem histórico atrás, o recorde é zero —
     o mesmo que valia quando o comparativo era um mês anterior inexistente. */
  const recorde = new Map();      // cs|k -> maior valor em mês < mes
  (b.linhas||[]).forEach(x=>{
    if(!MARCA_DAGUA.has(x.k) || !(x.mes < mes)) return;
    const ch = x.cs+'|'+x.k;
    if((x.valor||0) > (recorde.get(ch)||0)) recorde.set(ch, x.valor||0);
  });
  const porCs = new Map();
  const linha = cs => {
    let l = porCs.get(cs);
    if(!l){
      l = {cs};
      met.forEach(m=>{ l[m.k]=0; l['_base_'+m.k]=null; l['_quem_'+m.k]=[] });
      l.filiaisSemTipo = 0; l['_quem_filiaisSemTipo'] = [];   // não é regra, é aviso
      porCs.set(cs,l);
    }
    return l;
  };
  (b.linhas||[]).forEach(x=>{
    if(x.mes!==mes) return;
    const l = linha(x.cs);
    /* `filiaisSemTipo` não é uma regra (não está em METRICAS): vem junto para a
       célula de varejos poder dizer quantas filiais do mês ficaram sem
       classificação, em vez de mostrar zero sem explicação. */
    l[x.k] = x.valor;
    l['_base_'+x.k] = MARCA_DAGUA.has(x.k) ? (recorde.get(x.cs+'|'+x.k) || 0) : x.base;
  });
  (b.detalhe||[]).forEach(x=>{
    if(x.mes!==mes) return;
    const l = linha(x.cs);
    const arr = l['_quem_'+x.k]; if(arr) arr.push(x.cliente + (x.valor>1 ? ' ('+fmt.int(x.valor)+')' : ''));
  });
  /* Varejos novos: o número é RECONTADO aqui a partir da lista de filiais, em
     vez de lido pronto do dados.js. É isso que faz a marcação feita na tela
     valer na hora, sem esperar a carga das 04:00 do dia seguinte. Com dados.js
     antigo (sem a lista), filiaisDoMes devolve null e continua valendo o
     agregado que veio da carga. */
  const filiaisMes = filiaisDoMes(mes);
  if(filiaisMes){
    porCs.forEach(l=>{ l.filiais=0; l.filiaisSemTipo=0;
      l['_quem_filiais']=[]; l['_quem_filiaisSemTipo']=[] });
    filiaisMes.forEach(f=>{
      const l = linha(f.cs);
      const t = varejoTipo(f);
      if(t==='Varejo'){ l.filiais++; l['_quem_filiais'].push(f.nome) }
      /* Marca apontada à mão nunca é "sem classificação": ela só existe porque
         alguém já disse que é varejo. */
      else if(!t && !f.extra){ l.filiaisSemTipo++; l['_quem_filiaisSemTipo'].push(f.nome) }
    });
  }
  /* Quem não teve nenhuma linha no mês ainda precisa existir na tabela: um CS
     zerado é informação, não ausência de dado. */
  DATA.meta.cs?.forEach(cs=>{ if(cs && cs!=='Sem CS') linha(cs) });
  return [...porCs.values()].sort((a,b2)=>
    /^\(?Sem/i.test(a.cs) ? 1 : /^\(?Sem/i.test(b2.cs) ? -1 : a.cs.localeCompare(b2.cs,'pt-BR'));
}

/* ----------------------------------------------------------------------------
   PONTUAÇÃO DA BONIFICAÇÃO
   ----------------------------------------------------------------------------
   A régua da Laura, revisada em 01/09/2026. Cada regra vira pontos em cima do
   MESMO número da tabela de cima — nada é medido de novo aqui, só convertido:

     Tino ............... 10 pontos por cliente EXTRA com 40+ eventos acima da
                          MARCA D'ÁGUA do CS (o maior mês que ele já fez)
     Mensalidade ........ meta 0: 3 pontos a cada 1% acima da MARCA D'ÁGUA
     VestiPago .......... meta 40%: 2 pontos a cada 1% acima dela, contra o mesmo
                          mês do ano passado (41% = 2 pts, 42% = 4 pts)
     Reuniões ........... 1 ponto cada
     Integrações ativas . 10 pontos por integração acima da MARCA D'ÁGUA
     GMV ................ meta 10%: 2 pontos a cada 1% acima dela, contra o mesmo
                          mês do ano passado (11% = 2 pts, 12% = 4 pts)
     Varejos ............ 10 pontos cada

   Duas decisões que não estavam escritas na régua e valem dizer:
   - queda não tira ponto. Mês que não bate a marca d'água, ou que fica abaixo da
     meta, dá zero naquela regra — nunca pontuação negativa;
   - só ponto fechado conta: 41,9% no VestiPago são 1 ponto de excedente sobre a
     meta de 40%, não 2. A meta em si não paga nada: bater exatamente 40% é zero.

   Histórico da régua:
   - 31/08/2026: Tino e mensalidade trocaram o mês anterior pela marca d'água.
   - 01/09/2026: "Novas integrações" (fluxo, 0 ou 1 por mês) foi SUBSTITUÍDA por
     "Integrações ativas" (estoque), que herdou a vaga de pontos, agora valendo
     10. Mensalidade virou percentual, e VestiPago e GMV ganharam meta — antes
     qualquer crescimento pagava. */
const REGRAS_PONTOS = [
  { k:'tino60', l:'Tino', regra:'10 pts por cliente extra (40+ eventos) acima da marca d\u2019água',
    calc:r=>pontosExtra(r,'tino60',10,'cliente(s)') },
  { k:'mensalidade', l:'Mensalidade', regra:'3 pts a cada 1% acima da marca d\u2019água',
    calc:r=>pontosPct(r,'mensalidade',0,3) },
  { k:'vestipago', l:'VestiPago', regra:'meta 40%: 2 pts a cada 1% acima dela (vs. ano passado)',
    calc:r=>pontosPct(r,'vestipago',40,2) },
  { k:'reunioes', l:'Reuniões', regra:'1 pt por reunião',
    calc:r=>({p:(r.reunioes||0)*1, como:fmt.int(r.reunioes||0)+' × 1'}) },
  { k:'integracoesAtivas', l:'Integrações ativas', regra:'10 pts por integração acima da marca d\u2019água',
    calc:r=>pontosExtra(r,'integracoesAtivas',10,'integração(ões)') },
  { k:'gmv', l:'GMV', regra:'meta 10%: 2 pts a cada 1% acima dela (vs. ano passado)',
    calc:r=>pontosPct(r,'gmv',10,2) },
  { k:'filiais', l:'Varejos', regra:'10 pts por varejo novo',
    calc:r=>({p:(r.filiais||0)*10, como:fmt.int(r.filiais||0)+' × 10'}) },
];
/* Regras de UNIDADE acima do comparativo: conta quantos a mais que a base, em
   número inteiro. Tino e integrações ativas usam a marca d'água como base. */
function pontosExtra(r, k, porUnidade, unidade){
  const extra = (r[k]||0) - (r['_base_'+k]||0);
  return extra > 0
    ? {p: extra*porUnidade, como: fmt.int(extra)+' '+unidade+' × '+porUnidade}
    : {p:0};
}
/* Regras de crescimento percentual (régua da Laura, 01/09/2026). Duas peças:
   `meta` é o piso — só o que passa dela conta, e a meta em si não paga nada
   (VestiPago 40%, GMV 10%, mensalidade 0); `porPonto` é quanto vale cada 1%
   inteiro acima da meta. Só ponto fechado conta: 41,9% com meta 40 é 1 ponto de
   excedente, não 2. Sem base não há porcentagem — e não dá para chamar de
   crescimento o que não tem de onde crescer, então vale zero. */
function pontosPct(r, k, meta, porPonto){
  const base = r['_base_'+k], v = r[k]||0;
  if(!base) return {p:0, como: v ? 'sem base para comparar' : ''};
  const pct = (v - base)/base*100;
  if(pct <= meta) return {p:0, como: pct>0 ? fmt.pct1(pct)+' — abaixo da meta de '+meta+'%' : ''};
  const acima = Math.floor(pct) - meta;
  const p = acima * porPonto;
  /* Base minúscula em 2025 estoura a regra: quem tinha R$ 1,1 mil de GMV no ano
     passado e tem R$ 220 mil hoje cresce 19.000% e faria 19 mil pontos sozinho.
     Isso quase nunca é venda — é carteira que mudou de dono (a marca é creditada
     ao CS de HOJE, o cadastro não guarda quem atendia antes) ou marca que nem
     existia. O ponto continua sendo o que a régra manda: quem decide se corta é
     a Laura. Aqui a célula só avisa, para ninguém ler o número como crescimento. */
  const suspeito = pct > 300;
  return {p, como: fmt.pct1(pct) + (meta ? ' − meta '+meta+'%' : '') + ' = '+acima+' × '+porPonto+' = '+p
    + (suspeito ? ' · base de '+(Number(mesBonificacao().slice(0,4))-1)+': '+fmt.moneyCompact(base) : ''),
    alerta: suspeito};
}
/* Quem entra na bonificação e desde quando (Laura, 27/08/2026). A tabela de cima
   continua mostrando o time inteiro — é medida, não é prêmio; a pontuação é só
   destas três, e só de julho/2026 para frente. Mês anterior a isso não mostra
   pontuação nenhuma: não existiu bonificação lá atrás, e um número na tela seria
   lido como se tivesse existido. */
const CS_PONTUADOS = ['Thamiris Ribeiro', 'Gabriella Busto', 'Luana Coutinho'];
const MES_INICIO_PONTOS = '2026-07';
/* O HubSpot escreve a mesma pessoa com nome curto e completo, então a comparação
   é por prefixo — a mesma régua que o fetcher usa para não duplicar a linha. */
function ehPontuado(cs){
  return CS_PONTUADOS.some(n => n===cs || String(cs||'').startsWith(n+' ') || n.startsWith(cs+' '));
}

/* Segunda tabela da aba: os CS bonificados, agora em pontos. Recebe as linhas já
   filtradas pela tabela de cima, para os dois quadros nunca discordarem. */
function renderPontos(rows){
  const card = el('div',{class:'table-card'});
  card.style.marginTop = '18px';
  const mes = mesBonificacao();
  const head = el('div',{class:'table-head'});
  head.innerHTML = '<h3>Pontuação por CS</h3>'
    + `<span class="count">${rotuloMes(mes)}</span>`;
  card.appendChild(head);
  if(mes < MES_INICIO_PONTOS){
    card.appendChild(el('div',{class:'empty'},
      '<h4>Sem pontuação neste mês</h4><p>A bonificação começa em <b>julho de 2026</b>. '
      + 'Os meses anteriores continuam na tabela de cima, como número — só não valem ponto.</p>'));
    return card;
  }
  /* A régua em cima da tabela, em texto corrido e QUEBRANDO LINHA: em uma linha
     só (que é como o .eyebrow desenha) ela some na borda do card. */
  card.appendChild(el('div',{style:'padding:0 18px 12px;font-size:12px;line-height:1.7;color:var(--ink-3)'},
    REGRAS_PONTOS.map(g=>`<b>${g.l}</b>: ${g.regra}`).join(' &nbsp;·&nbsp; ')
    + ' &nbsp;·&nbsp; queda não tira ponto'
    + '<br><b>Quem pontua:</b> ' + CS_PONTUADOS.join(', ').replace(/, ([^,]*)$/,' e $1')
    + ', de julho de 2026 em diante.'));

  const linhas = rows.filter(r=>ehPontuado(r.cs)).map(r=>{
    const o = {cs:r.cs, total:0};
    REGRAS_PONTOS.forEach(g=>{
      const res = g.calc(r) || {p:0};
      o[g.k] = res.p || 0; o['_como_'+g.k] = res.como || '';
      o['_alerta_'+g.k] = !!res.alerta;
      o.total += o[g.k];
    });
    return o;
  }).sort((a,b)=> b.total - a.total || a.cs.localeCompare(b.cs,'pt-BR'));

  if(!linhas.length){
    card.appendChild(el('div',{class:'empty'},
      '<h4>Nenhum CS bonificado nesta seleção</h4><p>A pontuação vale para '
      + CS_PONTUADOS.join(', ').replace(/, ([^,]*)$/,' e $1')
      + '. Limpe o filtro de CS para ver.</p>'));
    return card;
  }

  const scroll = el('div',{class:'table-scroll'});
  const table = el('table');
  const thead = el('thead'), trh = el('tr');
  trh.appendChild(el('th',{},'CS responsável'));
  REGRAS_PONTOS.forEach(g=>{ const th = el('th',{class:'r'},g.l); th.title = g.regra; trh.appendChild(th) });
  trh.appendChild(el('th',{class:'r'},'Total'));
  thead.appendChild(trh); table.appendChild(thead);

  const tbody = el('tbody');
  linhas.forEach(l=>{
    const tr = el('tr');
    tr.appendChild(el('td',{},`<span class="cs-chip"><b>${iniciais(l.cs)}</b>${l.cs}</span>`));
    REGRAS_PONTOS.forEach(g=>{
      const td = el('td',{class:'r num'});
      td.innerHTML = l[g.k] ? `<span class="cell-main">${fmt.int(l[g.k])}</span>`
                            : '<span class="cell-sub">—</span>';
      if(l['_alerta_'+g.k]) td.innerHTML += '<span class="cell-sub var-down">base ~0 no ano anterior</span>';
      /* De onde saiu o ponto: sem isso a CS vê "30" e não tem como conferir se
         são 3 clientes no Tino ou arredondamento da mensalidade. */
      const como = l['_como_'+g.k];
      td.title = g.regra + (como ? ' · ' + como : '');
      tr.appendChild(td);
    });
    tr.appendChild(el('td',{class:'r num strong'},
      `<span class="cell-main" style="font-weight:700">${fmt.int(l.total)}</span>`));
    tbody.appendChild(tr);
  });
  /* Fecha com o somatório das três: a bonificação é discutida em conjunto, e
     "quanto deu no mês" é a primeira pergunta depois de "quanto eu fiz". */
  const tot = el('tr'); tot.style.fontWeight = '600';
  tot.appendChild(el('td',{},'<span class="cell-sub">Soma das três</span>'));

}

/* Mês escolhido no filtro; por padrão, o último mês que tem dado. */
function mesBonificacao(){
  const b = DATA.bonificacao || {meses:[]};

/* Legenda do KPI "Marcas com Tino": o total que a própria API do Tino informa,
   que é a régua oficial do produto — a tabela mostra menos quando há filtro
   ligado. Não repete "nunca acessaram" aqui de propósito: o KPI ao lado conta
   isso pela linha (marca sem last_login), e a API usa outro critério — dois
   números diferentes lado a lado só confundiriam. */
function tinoKpiTexto(){

const soma=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0);
const media=(a,k)=>a.length?soma(a,k)/a.length:0;
const pctTexto=(p,t)=>t?Math.round(p/t*100)+'%':'—';
function maisFrequente(a,k){const m={};a.forEach(x=>m[x[k]]=(m[x[k]]||0)+1);const e=Object.entries(m).sort((x,y)=>y[1]-x[1])[0];return e?e[0]:'—'}
/* O bucket com mais cancelamentos dentro do período — dia, semana ou mês,
   conforme o agrupamento que o próprio período escolheu. */
/* Fechado = SOMENTE 'Ganho'. 'Em aberto' não conta nem como ganho nem como perdido. */
function kpisDeal(rows){
  const g=rows.filter(r=>r.status==='Ganho'),
        p=rows.filter(r=>r.status==='Perdido'),
        a=rows.filter(r=>r.status==='Em aberto');
  const decididos = g.length+p.length;
  return [
    {l:'Valor ganho', v:fmt.moneyCompact(soma(g,'valor')), s:`${g.length} negócios fechados`},
    {l:'Valor perdido', v:fmt.moneyCompact(soma(p,'valor')), s:`${p.length} negócios`},
    {l:'Em aberto', v:fmt.moneyCompact(soma(a,'valor')), s:`${a.length} sem desfecho`},
    {l:'Taxa de conversão', v:decididos?Math.round(g.length/decididos*100)+'%':'—', s:'ganhos sobre os decididos'},
  ];
}

     mesBonificacao() / o gráfico da aba */
  mesBonificacao:'', metricaBonificacao:'' };
/* `canais` e `cs` vazios querem dizer "todos" — assim o filtro nasce sem nada
   marcado e marcar um item já é o recorte, sem precisar desmarcar os outros. */

/* cor: clareia um hex em direção ao branco (0 = cor cheia, 1 = branco) */
function tint(hex,f){
  const n=parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  const m=v=>Math.round(v+(255-v)*(1-f));
  return '#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
const HUES=['0','1','2','3','4','5'];
function hueDe(txt){ let h=0; for(const ch of String(txt)) h=(h*31+ch.charCodeAt(0))>>>0; return HUES[h%HUES.length] }
function iniciais(n){ return String(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() }

function aba(){ return TABS.find(t=>t.id===estado.aba) }

function filtrarLinhas(t){
  const f = estado.filtros;
  const chave = t.chaveCliente || 'cliente';
  let rows = t.linhas().slice();

  if(f.cliente && t.filtros.includes('cliente')){
    const q = f.cliente.toLowerCase();
    rows = rows.filter(r=>String(r[chave]||'').toLowerCase().includes(q)
                       || String(r.negocio||'').toLowerCase().includes(q));
  }
  if(t.filtros.includes('cs') && f.cs.size){
    rows = rows.filter(r=>f.cs.has(csDaLinha(t,r)));
  }
  /* Canal: seleção múltipla, vazia = todos. A linha pode trazer o canal (ticket,
     tabela geral) ou não (abas de produto, que agregam por cliente) — nesse caso
     pergunta ao cadastro pelo nome do cliente. */
  if(t.filtros.includes('canal') && f.canais.size){
    rows = rows.filter(r=>f.canais.has(r.canal || CANAL_POR_CLIENTE[r[chave]] || 'Sem canal'));
  }
  if(t.filtros.includes('pipeline') && f.pipeline!=='todos'){
    rows = rows.filter(r=>r.pipeline===f.pipeline);
  }
  if(t.filtros.includes('statusTicket') && f.statusTicket!=='todos'){
    rows = f.statusTicket==='abertos'
      ? rows.filter(r=>r.situacao!=='Encerrado')
      : rows.filter(r=>r.situacao==='Encerrado');
  }
  if(t.filtros.includes('statusCliente') && f.statusCliente!=='todos'){
    rows = rows.filter(r=>r.status===f.statusCliente);
  }
  if(t.filtros.includes('statusDeal') && f.statusDeal!=='todos'){
    rows = rows.filter(r=>r.status===f.statusDeal);
  }
  if(t.filtros.includes('resultadoReuniao') && f.resultadoReuniao!=='todos'){
    rows = f.resultadoReuniao==='fechou'   ? rows.filter(r=>r.resultado==='Fechou negócio')
         : f.resultadoReuniao==='semNeg'   ? rows.filter(r=>r.resultado==='Sem negócio')
         : f.resultadoReuniao==='agendada' ? rows.filter(r=>r.resultado==='Agendada')
         : rows;
  }
  // período: só recorta linhas que carregam data própria. Onde a linha é um
  // agregado (tabela geral, produtos), o período já entrou na agregação.
  if(t.filtros.includes('periodo')){
    const temData = rows.some(r=>r.data);
    /* Reunião já marcada para a frente ficaria invisível — e ela é justamente a
       agenda do que vem. Quando o período vai até hoje ("estou olhando o
       agora"), o que está por vir entra junto. */
    const futuroVale = t.id==='reunioes' && estado.filtros.periodo.fim >= LIMITE_DADOS.fim;
    if(temData) rows = rows.filter(r=>!r.data || dentroDaJanela(r.data)
      || (futuroVale && String(r.data).slice(0,10) > estado.filtros.periodo.fim));
  }

  const o = estado.ordem[t.id];
  if(o){
    rows.sort((a,b)=>{
      let x=a[o.k], y=b[o.k];
      if(o.k==='_dia'){ x=a.data||''; y=b.data||'' }
      if(x==null && y==null) return 0;
      if(x==null) return 1;
      if(y==null) return -1;
      if(typeof x==='number'&&typeof y==='number') return o.dir*(x-y);
      return o.dir*String(x).localeCompare(String(y),'pt-BR');
    });
  }
  return rows;
}

/* Escopo dos gráficos: obedece só a cliente + CS. Filtros de linha
   (status do negócio, situação do churn) não devem mexer no histórico. */
function escopoClientes(t){
  const f = estado.filtros;
  let nomes = DATA.clientes.map(c=>c.nome);
  if(t.filtros.includes('cliente') && f.cliente){
    const q = f.cliente.toLowerCase();
    nomes = nomes.filter(n=>n.toLowerCase().includes(q));
  }
  if(t.filtros.includes('cs') && f.cs.size){
    nomes = nomes.filter(n=>f.cs.has(CS_POR_CLIENTE[n]||'Sem CS'));
  }
  if(t.filtros.includes('canal') && f.canais.size){
    nomes = nomes.filter(n=>f.canais.has(CANAL_POR_CLIENTE[n]||'Sem canal'));
  }
  return new Set(nomes);
}

/* --- agrupamento do eixo do tempo ---
   As séries são diárias. Desenhar 365 barras não se lê, e desenhar 7 dias como
   um único ponto mensal esconde o que se quer ver — então o passo do gráfico
   sai do tamanho do período: até 45 dias mostra dia a dia, até 400 agrupa por
   semana, acima disso por mês. O filtro continua exato: quem agrupa é só o
   desenho. */
function grãoDoPeriodo(p){
  const dias = diasEntre(p.ini, p.fim) + 1;
  return dias <= 45 ? 'dia' : dias <= 400 ? 'semana' : 'mes';
}
/* Data -> chave do bucket a que ela pertence. Na semana, a chave é a
   segunda-feira: assim a barra "semana de 10/ago" é sempre a mesma, independente
   de onde o período começa. */
function bucketDe(iso, grao){
  if(grao==='mes') return iso.slice(0,7);
  if(grao==='dia') return iso;
  const d = new Date(iso+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay()+6)%7));
  return d.toISOString().slice(0,10);
}
function rotuloBucket(chave, grao){
  if(grao==='mes') return fmt.mes(chave+'-01');
  if(grao==='dia') return fmt.dia(chave);
  return fmt.dia(chave);
}
/* Todos os buckets do período, inclusive os vazios — sem eles o gráfico
   emendaria dois picos separados por uma semana sem venda. */
function bucketsDoPeriodo(p, grao){
  const out = [];
  if(grao==='mes'){
    let m = p.ini.slice(0,7);
    while(m <= p.fim.slice(0,7)){
      out.push(m);
      const [y,mm] = m.split('-').map(Number);
      m = new Date(Date.UTC(y, mm, 1)).toISOString().slice(0,7);
    }
    return out;
  }
  const passo = grao==='dia' ? 1 : 7;
  let d = bucketDe(p.ini, grao);
  const fim = bucketDe(p.fim, grao);
  let guarda = 0;
  while(d <= fim && guarda++ < 1200){ out.push(d); d = somarDias(d, passo) }
  return out;
}

function agregarSerie(t){
  if(!t.series) return [];
  const p = periodo();
  const grao = grãoDoPeriodo(p);
  const nomes = escopoClientes(t);
  const mapa = new Map();
  bucketsDoPeriodo(p, grao).forEach(b=>mapa.set(b,{bucket:b, rotulo:rotuloBucket(b,grao), grao}));
  const f = estado.filtros;
  t.series().forEach(x=>{
    if(!dentroDaJanela(x.data)) return;
    /* seriePropria: a linha traz o próprio responsável e pode ser de uma marca
       que não está na carteira (empresa do HubSpot, marca só do Tino). Aí o
       recorte é feito na própria linha, senão ela sumiria do gráfico. */
    if(t.seriePropria){
      if(t.filtros.includes('cliente') && f.cliente
         && !String(x.cliente||'').toLowerCase().includes(f.cliente.toLowerCase())) return;
      if(t.filtros.includes('cs') && f.cs.size && !f.cs.has(normalizarCs(x.cs)||'Sem CS')) return;
    } else if(x.cliente && !nomes.has(x.cliente)) return;
    const alvo = mapa.get(bucketDe(String(x.data).slice(0,10), grao)); if(!alvo) return;
    for(const k in x){
      if(k==='data'||k==='cliente'||k==='dominio'||k==='cs') continue;
      if(typeof x[k]!=='number') continue;
      alvo[k]=(alvo[k]||0)+x[k];
    }
  });
  return [...mapa.values()].map(o=>{ for(const k in o) if(o[k]==null) o[k]=0; return o });
}

function renderPagina(){

     onde vem cada número — só nunca tinha sido desenhado (o CSS de .page-head p
     estava lá, sem ninguém para usar). É o disclaimer da aba: fica embaixo do
     título, antes dos filtros, para quem abre a tela ler a régua antes de
     interpretar a tabela. */
  head.innerHTML = `<div><span class="eyebrow">${t.grupo}</span><h1>${t.titulo}</h1>`

    page.appendChild(box);
  }

  if(t.graficos && t.graficos.length){
    /* A régua só faz sentido onde o eixo é o tempo. A aba de Bonificação
       trabalha em mês fechado e tem seletor próprio. */
    if(t.filtros.includes('periodo')){
      page.appendChild(el('div',{class:'section-label'},'<span class="eyebrow">Histórico no período</span>'));
      page.appendChild(renderRegua(serie));

      card.innerHTML = `<div class="card-head"><h3>${g.t}</h3><div class="legend">${leg}</div></div>
                        <div class="chart-wrap" id="ch-${t.id}-${i}"></div>`;
      wrap.appendChild(card);
    });
    page.appendChild(wrap);
    t.graficos.forEach((g,i)=>{
      const host = document.getElementById(`ch-${t.id}-${i}`);
      if(g.categorias) desenharCategorias(host, cats[i]);

     geral) — o conteúdo inteiro vem dos gráficos de categoria e do extra. */
  if(!t.semTabela) page.appendChild(renderTabela(t, rows));

     história inteira — Bonificação usa para a pontuação, Visão geral para as
     listas por trás de cada KPI. */
  if(t.extra){ const ex = t.extra(rows); if(ex) page.appendChild(ex) }

    const met = METRICAS();

      ['Perdido','Somente perdidos'],['Em aberto','Somente em aberto']],

  if(t.filtros.includes('situacao')){

      ['Em risco','Em risco (ativos)'],['todos','Todos']],

  acts.appendChild(limpar);

  return box;

/* --- seletor de CS: múltipla escolha, nenhum marcado = todo o time --- */
function seletorDeCs(t){
  const sel = estado.filtros.cs;
  const lista = csDaAba(t);
  const box = el('div',{class:'wk-pick'});
  const rotulo = t.id==='tickets' ? 'responsáveis' : 'CS';

  const resumo = ()=> !sel.size ? (t.id==='tickets' ? 'todos os responsáveis' : 'todo o time')
    : sel.size===1 ? [...sel][0]
    : sel.size+' '+rotulo;

  const botao = el('button',{class:'wk-btn',type:'button'},
    '<span>'+resumo()+'</span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>');
  const painel = el('div',{class:'wk-pop'});
  if(estado.csAberto) painel.classList.add('aberto');
  botao.onclick = (e)=>{ e.stopPropagation();
    estado.csAberto = !estado.csAberto;
    painel.classList.toggle('aberto', estado.csAberto);
  };

  const quick = el('div',{class:'wk-quick'});
  const todos = el('button',{class:'wk-chip',type:'button'},'Todos');
  todos.onclick=(e)=>{e.stopPropagation(); sel.clear(); renderPagina()};
  quick.appendChild(todos);
  const nenhum = el('button',{class:'wk-chip',type:'button'},'Inverter');
  nenhum.onclick=(e)=>{e.stopPropagation();
    const novo = lista.filter(n=>!sel.has(n));
    sel.clear(); novo.forEach(n=>sel.add(n)); renderPagina()};

      title:'Linhas de '+n},n);
    b.onclick=(e)=>{e.stopPropagation(); on?sel.delete(n):sel.add(n); renderPagina()};
    chips.appendChild(b);
  });
  painel.appendChild(chips);
  painel.onclick = e => e.stopPropagation();

  box.appendChild(botao); box.appendChild(painel);
  return box;
}
