name: Atualizar Relatorio StarkBank VestiPago

on:
  schedule:
    - cron: '0 * * * *'  # de hora em hora
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do disparo manual'
        required: false
        default: 'manual'
      somente_fabric:
        description: 'Modo rapido: atualiza so CP/Antecipacao (Fabric, ~1min). Pula o fetcher de Faturas da API Vesti (~22min).'
        type: boolean
        required: false
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar ODBC Driver 18 for SQL Server
        run: |
          . /etc/os-release
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -sSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev

      - name: Instalar dependencias Python
        run: pip install pyodbc

      - name: Rodar fetcher StarkBank (Fabric)
        working-directory: relatoriostarkbank
        env:
          FABRIC_REFRESH_TOKEN: ${{ secrets.FABRIC_REFRESH_TOKEN }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
        run: python fetch_data.py

      - name: Rodar fetcher Faturas (API Vesti)
        # Etapa lenta (~22min). Pulada no modo rapido (somente_fabric=true).
        # Em runs agendados github.event.inputs e nulo, entao roda normalmente.
        if: ${{ github.event.inputs.somente_fabric != 'true' }}
        working-directory: relatoriostarkbank
        env:
          VESTIAPI_TOKEN: ${{ secrets.VESTIAPI_TOKEN }}
        run: python fetch_invoices.py

      - name: Rodar fetcher Cancelados (Fabric)
        working-directory: relatoriostarkbank
        env:
          FABRIC_REFRESH_TOKEN: ${{ secrets.FABRIC_REFRESH_TOKEN }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
        run: python fetch_cancelados.py

      - name: Commit e push se houver mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Arquivos gerados sao regeracoes completas. No modo rapido o invoices.js
          # (CR) NAO foi tocado, entao nao o incluimos pra nao reverter um update
          # concorrente da API. Em runs completos/agendados, inclui os tres.
          if [ "${{ github.event.inputs.somente_fabric }}" = "true" ]; then
            FILES="relatoriostarkbank/dados.js relatoriostarkbank/cancelados_valores.js"
          else
            FILES="relatoriostarkbank/dados.js relatoriostarkbank/invoices.js relatoriostarkbank/cancelados_valores.js"
          fi
          MSG="Atualizacao StarkBank $(date +'%d/%m/%Y %H:%M')"
          # Sem rebase: reaplica nossos arquivos recem-gerados sobre o topo do remoto.
          # Evita conflitos de merge em arquivos regenerados quando dois runs colidem.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            # reset MIXED: index volta pro topo do remoto (preserva mudancas
            # concorrentes em outros arquivos); working tree intacto com nossos
            # arquivos gerados, que re-adicionamos a seguir.
            git reset -q origin/main
            git add $FILES 2>/dev/null || true
            if git diff --cached --quiet; then echo "sem mudancas"; exit 0; fi
            git commit -q -m "$MSG"
            if git push; then echo "push ok (tentativa $i)"; exit 0; fi
            echo "push falhou (tentativa $i), re-sincronizando..."
            sleep 3
          done
          echo "push falhou apos varias tentativas"; exit 1
