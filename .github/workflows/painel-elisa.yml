name: Atualizar Painel Elisa

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 BRT
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        run: pip install google-cloud-bigquery google-auth

      - name: Gravar credencial BigQuery (SA key)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp_sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp_sa.json" >> "$GITHUB_ENV"

      - name: Rodar pipeline (fetch BQ + ambiente + build)
        working-directory: Gambiarra
        run: |
          python fetch_elisa_bq.py
          python fetch_ambiente.py
          python build_data.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES="Gambiarra/dashboard_data.js Gambiarra/companies_elisa.json Gambiarra/gmv_elisa.json Gambiarra/cadastros_elisa.json Gambiarra/vestipago_elisa.json Gambiarra/reativacao_elisa.json Gambiarra/links_elisa.json Gambiarra/pagamentos_elisa.json Gambiarra/ambiente_elisa.json Gambiarra/inadimplentes_elisa.json"
          MSG="Atualizacao Painel Elisa $(date +'%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q origin/main
            git add $FILES 2>/dev/null || true
            if git diff --cached --quiet; then echo "sem mudancas"; exit 0; fi
            git commit -q -m "$MSG"
            if git push; then echo "push ok (tentativa $i)"; exit 0; fi
            echo "push falhou (tentativa $i), re-sincronizando..."
            sleep 3
          done
          echo "push falhou apos varias tentativas"; exit 1
