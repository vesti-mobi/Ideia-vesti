name: Debug RB Store StarkBank

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar debug RB Store
        working-directory: relatoriostarkbank
        env:
          VESTIAPI_TOKEN: ${{ secrets.VESTIAPI_TOKEN }}
        run: python _debug_rbstore.py
