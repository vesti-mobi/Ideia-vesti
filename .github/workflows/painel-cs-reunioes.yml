name: Painel CS Reunioes - Refresh
on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 BRT diariamente
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch HubSpot + build
        working-directory: PlanilhasEPainelCS
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          python fetch_hubspot.py
          python build_html.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PlanilhasEPainelCS/real_data.js PlanilhasEPainelCS/hubspot_raw.json PlanilhasEPainelCS/index.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "PlanilhasEPainelCS: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
