name: TMP match apelidos relatoriocs2 fase 2

on:
  workflow_dispatch:

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install google-cloud-bigquery

      - name: Buscar sem o filtro de modulo
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cd relatoriocs2
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import bq_enrich as B

          # marca da planilha -> termo distintivo (o suficiente p/ nao pegar CPF)
          ALVOS = {
              "Baubaki": "baubaki", "Menina Moleka Kids": "moleka",
              "Elas charmosa": "elas charm", "Dama Jeans": "dama jeans",
              "Surf Center Company": "surf center", "Lazarf": "lazarf",
              "Circow": "circow", "Practory": "practory", "Amicca": "amicca",
              "Bebela": "bebela", "Riquezzi Jeans": "riquezzi",
              "Free Man": "free man", "New Sun": "new sun",
              "Use Fortiori": "fortiori", "Terceira Via Jeans": "terceira via",
              "Nino danielli": "nino dani", "Tiffany Beach": "tiffany bea",
          }
          ors = " OR ".join(f"LOWER(d.name) LIKE '%{t}%'" for t in ALVOS.values())
          SQL = f"""
          SELECT CAST(d.ID AS STRING) id, d.name,
                 CAST(d.modulos AS STRING) modulos,
                 DATE(CAST(d.created_at AS TIMESTAMP)) criada,
                 a.name anjo
          FROM `{B.PROJECT}.{B.DATASET}`.odbc_domains d
          LEFT JOIN `{B.PROJECT}.{B.DATASET}`.odbc_angels a
                 ON CAST(a.id AS STRING) = CAST(d.angel_id AS STRING)
          WHERE ({ors}) AND d.name IS NOT NULL
          ORDER BY LOWER(d.name)
          """
          rows = B._rows(B._client(), SQL, "dominios por termo, SEM filtro de modulo")
          print("\n" + "=" * 78)
          print(f"{len(rows)} dominio(s) encontrados no total\n")
          for marca, termo in ALVOS.items():
              hits = [r for r in rows if termo in str(r["name"]).lower()]
              print(f"\n### {marca}   (termo: {termo!r}) -> {len(hits)} hit(s)")
              for r in hits[:6]:
                  vendas = "VENDAS" if "vendas" in (r["modulos"] or "").lower() else "------"
                  print(f"   {vendas}  {str(r['name'])[:40]:40s} id={r['id']:8s} "
                        f"{r['criada']}  anjo={r['anjo']}")
          print("\n" + "=" * 78)
          PY
