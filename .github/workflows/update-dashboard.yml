name: Atualizar Dashboard CS diariamente

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install xlsx tedious @google-cloud/bigquery

      - name: Configurar credencial BigQuery
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp_sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp_sa.json" >> "$GITHUB_ENV"

      - name: Rebuild CS Sucesso do Cliente via BigQuery e HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node CS-Sucesso-do-cliente/build-cloud-bq.js

      - name: Patch fabricCounts (matriz/filial/total do PainelCSGerencial)
        continue-on-error: true
        run: node CS-Sucesso-do-cliente/patch-empresas.js

      # ---- Projetos ainda em Fabric (migração à parte): NovosVestiPago e Pedidos-por-Marca ----
      # NovosVestiPago roda PRIMEIRO de proposito: o client_id hardcoded do Pedidos-por-Marca
      # so aceita refresh token recem-emitido, entao ele precisa consumir o token que este step gera.
      - name: Rebuild Novos VestiPago via Fabric lakehouse
        continue-on-error: true
        env:
          FABRIC_REFRESH_TOKEN: ${{ secrets.FABRIC_REFRESH_TOKEN }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
        run: node NovosVestiPago/build.js

      - name: Propagar refresh token (Fabric)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE=""
          for f in NovosVestiPago/.new_refresh_token CS-Sucesso-do-cliente/.new_refresh_token; do
            if [ -f "$f" ]; then TOKEN_FILE="$f"; break; fi
          done
          if [ -n "$TOKEN_FILE" ]; then
            NEW_TOKEN=$(cat "$TOKEN_FILE")
            echo "::add-mask::$NEW_TOKEN"
            if [ -n "$GH_TOKEN" ]; then
              gh secret set FABRIC_REFRESH_TOKEN --body "$NEW_TOKEN" && echo "Secret rotacionado" || echo "WARN: gh secret set falhou"
            else
              echo "WARN: GH_PAT nao configurado — secret nao sera rotacionado (token vai expirar)"
            fi
            echo "FABRIC_REFRESH_TOKEN=$NEW_TOKEN" >> $GITHUB_ENV
            rm -f NovosVestiPago/.new_refresh_token CS-Sucesso-do-cliente/.new_refresh_token
          else
            echo "WARN: nenhum .new_refresh_token gerado — Pedidos-por-Marca vai usar o token do secret"
          fi

      - name: Rebuild Pedidos por Marca via Fabric
        continue-on-error: true
        env:
          FABRIC_REFRESH_TOKEN: ${{ env.FABRIC_REFRESH_TOKEN || secrets.FABRIC_REFRESH_TOKEN }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
        run: node Pedidos-por-Marca/build-cloud.js

      - name: Verificar se houve alteracao
        id: check
        run: |
          git add -A
          git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit e push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CS-Sucesso-do-cliente/dados.js Pedidos-por-Marca/dados.js Pedidos-por-Marca/chunks.js Pedidos-por-Marca/data/ NovosVestiPago/dados.js
          git commit -m "Atualizacao automatica completa $(date +'%d/%m/%Y %H:%M')"
          for i in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push falhou (tentativa $i), fazendo pull --rebase..."
            git pull --rebase origin main || { echo "Rebase falhou, abortando"; exit 1; }
          done
