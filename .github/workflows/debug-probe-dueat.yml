name: Debug Probe dueAt CP

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rodar probe
        working-directory: relatoriostarkbank
        env:
          VESTI_ORDER_TOKEN: ${{ secrets.VESTI_ORDER_TOKEN }}
        run: python _probe_dueat.py
