name: TMP inspecionar pedidos no BQ

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install google-cloud-bigquery

      - name: Inspecionar
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cd relatoriocs2
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import bq_enrich as B

          c = B._client()

          print("\n=== tabelas com 'quote' ou 'pedido' no nome ===")
          sql = f"""
          SELECT table_name, row_count, ROUND(size_bytes/1e9, 2) gb
          FROM `{B.PROJECT}.{B.DATASET}.__TABLES__`
          WHERE LOWER(table_id) LIKE '%quote%' OR LOWER(table_id) LIKE '%pedido%'
             OR LOWER(table_id) LIKE '%order%'
          """
          sql = sql.replace("table_name", "table_id")
          for r in B._rows(c, sql, "tabelas"):
              print(f"   {r['table_id']:38s} {r['row_count']:>12,} linhas  {r['gb']} GB")

          print("\n=== odbc_quotes: cobertura ===")
          for r in B._rows(c, f"""
              SELECT MIN(DATE(created_at)) menor, MAX(DATE(created_at)) maior,
                     COUNT(*) linhas, COUNT(DISTINCT id) ids
              FROM `{B.PROJECT}.{B.DATASET}.odbc_quotes`
          """, "odbc_quotes"):
              print(f"   {r['menor']} -> {r['maior']} | {r['linhas']:,} linhas | {r['ids']:,} ids unicos")

          print("\n=== odbc_quotes por ano ===")
          for r in B._rows(c, f"""
              SELECT EXTRACT(YEAR FROM created_at) ano, COUNT(*) n
              FROM `{B.PROJECT}.{B.DATASET}.odbc_quotes`
              GROUP BY ano ORDER BY ano
          """, "por ano"):
              print(f"   {r['ano']}: {r['n']:,}")

          print("\n=== MongoDB_Pedidos_Geral: cobertura ===")
          for r in B._rows(c, f"""
              SELECT MIN(DATE(CAST(settings_createdAt AS TIMESTAMP))) menor,
                     MAX(DATE(CAST(settings_createdAt AS TIMESTAMP))) maior,
                     COUNT(*) linhas, COUNT(DISTINCT _id) ids
              FROM `{B.PROJECT}.{B.DATASET}.MongoDB_Pedidos_Geral`
          """, "MongoDB_Pedidos_Geral"):
              print(f"   {r['menor']} -> {r['maior']} | {r['linhas']:,} linhas | {r['ids']:,} ids unicos")

          print("\n=== MongoDB_Pedidos_Geral por ano ===")
          for r in B._rows(c, f"""
              SELECT EXTRACT(YEAR FROM CAST(settings_createdAt AS TIMESTAMP)) ano, COUNT(*) n
              FROM `{B.PROJECT}.{B.DATASET}.MongoDB_Pedidos_Geral`
              GROUP BY ano ORDER BY ano
          """, "por ano"):
              print(f"   {r['ano']}: {r['n']:,}")
          PY
